name: Render The Last Unobserved Room
on:
  push:
    branches: [main]
    paths:
      - "build/the-last-unobserved-room/render.trigger"

permissions:
  contents: write

jobs:
  render:
    uses: ./.github/workflows/render.yml
    with:
      slug: the-last-unobserved-room
    secrets: inherit

  record-status:
    needs: render
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record run status
        run: |
          mkdir -p build/the-last-unobserved-room
          printf '{"run_id": "%s", "result": "%s"}\n'             "${{ github.run_id }}" "${{ needs.render.result }}"             > build/the-last-unobserved-room/render-status.json
          git config user.name "render-bot"
          git config user.email "render@users.noreply.github.com"
          git add build/the-last-unobserved-room/render-status.json
          git commit -m "render the-last-unobserved-room: record status" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            git push && break
          done
