name: Render queued video request

on:
  push:
    branches: [main]
    paths:
      - "build/**/render.request"

permissions:
  contents: write
  actions: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: slug
        shell: bash
        run: |
          file="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^build/[^/]+/render\.request$' | head -n 1)"
          test -n "$file"
          slug="${file#build/}"
          slug="${slug%/render.request}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Mark render started
        shell: bash
        run: |
          slug="${{ steps.slug.outputs.slug }}"
          printf '%s\n' "$GITHUB_RUN_ID" > "build/$slug/render-started.txt"
          git config user.name "render-request-bot"
          git config user.email "render-request@users.noreply.github.com"
          git add "build/$slug/render-started.txt"
          git commit -m "render $slug: started $GITHUB_RUN_ID" || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          echo "unable to record render start after 5 attempts" >&2
          exit 1

  render:
    needs: detect
    uses: ./.github/workflows/accept-short-media-and-render.yml
    with:
      slug: ${{ needs.detect.outputs.slug }}
    secrets: inherit
