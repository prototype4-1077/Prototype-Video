name: Render queued video request

# Drop build/<slug>/render.request on main. A mandatory zero-cost preflight now
# runs before render.yml. Deterministic package defects are recorded and blocked
# without consuming a render runner.

on:
  push:
    branches: [main]
    paths:
      - "build/**/render.request"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify requested slug(s)
        id: slugs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" \
            | grep -E '^build/[^/]+/render\.request$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no render.request file in this push; nothing to do"
            echo "slugs=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          slugs=""
          for f in "${files[@]}"; do
            s="${f#build/}"; s="${s%/render.request}"
            slugs="$slugs $s"
          done
          echo "slugs=$(echo "$slugs" | xargs)" >> "$GITHUB_OUTPUT"

      - name: Mandatory render-readiness preflight
        id: preflight
        if: steps.slugs.outputs.slugs != ''
        shell: bash
        run: |
          set -euo pipefail
          passed=""
          blocked=""
          for slug in ${{ steps.slugs.outputs.slugs }}; do
            echo "preflighting $slug"
            if python3 pipeline/preflight.py "build/$slug" --fix-safe --record; then
              passed="$passed $slug"
            else
              blocked="$blocked $slug"
            fi
          done
          echo "passed=$(echo "$passed" | xargs)" >> "$GITHUB_OUTPUT"
          echo "blocked=$(echo "$blocked" | xargs)" >> "$GITHUB_OUTPUT"

      - name: Commit preflight evidence and safe fixes
        if: steps.slugs.outputs.slugs != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "render-preflight-bot"
          git config user.email "render-preflight@users.noreply.github.com"
          for slug in ${{ steps.slugs.outputs.slugs }}; do
            git add "build/$slug/script.json" "build/$slug/preflight-report.json" 2>/dev/null || true
          done
          git add pipeline/operational_memory/occurrences 2>/dev/null || true
          git commit -m "preflight: validate ${{ steps.slugs.outputs.slugs }}" || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((i * 2))
          done
          echo "preflight evidence could not be persisted; refusing render dispatch" >&2
          exit 1

      - name: Fire render.yml only for ready slugs
        if: steps.preflight.outputs.passed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for slug in ${{ steps.preflight.outputs.passed }}; do
            echo "dispatching render.yml for $slug (long_render=true)"
            gh workflow run render.yml -f slug="$slug" -f long_render=true
          done

      - name: Acknowledge passed and blocked requests
        if: steps.slugs.outputs.slugs != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "render-request-bot"
          git config user.email "render-request@users.noreply.github.com"
          for slug in ${{ steps.preflight.outputs.passed }}; do
            printf 'preflight passed; dispatched render.yml at %s (dispatcher run %s)\n' \
              "$(date -u +%FT%TZ)" "$GITHUB_RUN_ID" > "build/$slug/render-started.txt"
          done
          for slug in ${{ steps.preflight.outputs.blocked }}; do
            python3 - "$slug" <<'PY'
          import json, pathlib, sys
          slug = sys.argv[1]
          report = json.loads(pathlib.Path(f"build/{slug}/preflight-report.json").read_text(encoding="utf-8"))
          lines = [f"preflight blocked at {report.get('slug')}"]
          lines.extend(f"{item.get('code')}: {item.get('message')}" for item in report.get("blockers") or [])
          pathlib.Path(f"build/{slug}/render-blocked.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          done
          for slug in ${{ steps.slugs.outputs.slugs }}; do
            git rm -q "build/$slug/render.request" 2>/dev/null || true
            git add "build/$slug/render-started.txt" "build/$slug/render-blocked.txt" 2>/dev/null || true
          done
          git commit -m "render-request: processed ${{ steps.slugs.outputs.slugs }}" || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((i * 2))
          done
          echo "dispatch decision completed, but acknowledgement push failed" >&2
          exit 1
