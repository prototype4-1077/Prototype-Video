name: Pipeline tests

on:
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/render.yml"
      - ".github/workflows/pipeline-tests.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/render.yml"
      - ".github/workflows/pipeline-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Python deps
        run: pip install -q -r pipeline/requirements.txt
      - name: Compile pipeline
        run: python3 -m compileall -q pipeline
      - name: Regression tests
        run: python3 -m unittest discover -s pipeline/tests -v
