name: Pipeline tests

on:
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/render.yml"
      - ".github/workflows/pipeline-tests.yml"
      - "concept/characters/june_oxley_asset_v5.json"
      - "concept/characters/june_oxley_asset_v6.json"
      - "concept/characters/june_oxley_asset_v7.json"
      - "concept/characters/june_oxley_asset_v8.json"
      - "concept/style_frames/june_golden_scene_performance_slice_v1.json"
      - "concept/style_frames/june_golden_scene_rhubarb_lipsync_v1.json"
      - "concept/style_frames/june_golden_scene_expression_cues_v1.json"
      - "concept/style_frames/june_oxley_viseme_atlas_v1.json"
      - "concept/style_frames/june_oxley_viseme_atlas_v1.png"
      - "concept/style_frames/june_oxley_expression_atlas_v1.json"
      - "concept/style_frames/june_oxley_expression_atlas_v1.png"
      - "concept/style_frames/june_oxley_npr_look_v1.json"
      - "concept/style_frames/june_oxley_npr_look_v2.json"
      - "concept/style_frames/june_oxley_npr_look_v3.json"
      - "concept/style_frames/june_oxley_npr_look_v4.json"
      - "concept/style_frames/june_oxley_npr_look_v5.json"
      - "concept/style_frames/june_oxley_npr_look_v6.json"
      - "concept/style_frames/june_oxley_npr_look_v7.json"
      - "concept/style_frames/june_oxley_npr_look_v8.json"
      - "concept/style_frames/june_oxley_npr_finish_v1.json"
      - "concept/style_frames/june_oxley_npr_reward_v1.json"
      - "examples/june-golden-scene-twelve-dollar-mug.json"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/render.yml"
      - ".github/workflows/pipeline-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Python deps
        run: pip install -q -r pipeline/requirements.txt
      - name: Compile pipeline
        run: python3 -m compileall -q pipeline
      - name: Regression tests
        run: python3 -m unittest discover -s pipeline/tests -v
      - name: Render high-fidelity 2.5D June viseme preview
        run: |
          python3 -m pipeline.cartoon_viseme_atlas \
            concept/style_frames/june_oxley_viseme_atlas_v1.json \
            --output-dir build/edit/june-2p5d-viseme-preview
      - name: Verify 2.5D preview contract
        run: |
          set -euo pipefail
          video=build/edit/june-2p5d-viseme-preview/june-2p5d-viseme-preview.mp4
          ffmpeg -v error -i "$video" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "836"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "836"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$video")" = "135"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")" = "4.500000"
          sha256sum "$video"
      - name: Upload high-fidelity 2.5D June preview
        uses: actions/upload-artifact@v4
        with:
          name: june-2p5d-viseme-atlas-v1
          path: |
            build/edit/june-2p5d-viseme-preview/*.mp4
            build/edit/june-2p5d-viseme-preview/*.json
            build/edit/june-2p5d-viseme-preview/frames/frame_0001.png
            build/edit/june-2p5d-viseme-preview/frames/frame_0135.png
          if-no-files-found: error
          retention-days: 14
      - name: Render exact-clock 2.5D June expression performance
        run: |
          python3 -m pipeline.cartoon_viseme_atlas \
            concept/style_frames/june_oxley_viseme_atlas_v1.json \
            --cues concept/style_frames/june_golden_scene_rhubarb_lipsync_v1.json \
            --expression-atlas concept/style_frames/june_oxley_expression_atlas_v1.json \
            --expression-cues concept/style_frames/june_golden_scene_expression_cues_v1.json \
            --output-dir build/edit/june-2p5d-lipsync-performance
      - name: Verify 453-frame expression performance contract
        run: |
          set -euo pipefail
          video=build/edit/june-2p5d-lipsync-performance/june-2p5d-lipsync-performance.mp4
          ffmpeg -v error -i "$video" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "836"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "836"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$video")" = "453"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")" = "15.100000"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
          sha256sum "$video"
      - name: Upload exact-clock 2.5D June expression performance
        uses: actions/upload-artifact@v4
        with:
          name: june-2p5d-expression-performance-v1
          path: |
            build/edit/june-2p5d-lipsync-performance/*.mp4
            build/edit/june-2p5d-lipsync-performance/*.json
            build/edit/june-2p5d-lipsync-performance/frames/frame_0001.png
            build/edit/june-2p5d-lipsync-performance/frames/frame_0453.png
          if-no-files-found: error
          retention-days: 14

  blender-v8-oral-mask-visemes:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLENDER_VERSION: "4.2.0"
      BLENDER_SERIES: "Blender4.2"
    steps:
      - uses: actions/checkout@v4
      - name: Install headless render dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxrandr2 \
            libxinerama1 libxcursor1 libxkbcommon0 libsm6 libgl1 libegl1 \
            libglu1-mesa libwayland-client0 libwayland-egl1 libdbus-1-3 \
            ffmpeg xz-utils
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fL --retry 3 -o /tmp/blender.tar.xz "$url"
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
      - name: Verify Blender
        run: /opt/blender/blender --background --version
      - name: Render cheek-integrated nine-viseme NPR gate
        run: |
          set -euo pipefail
          python3 -m pipeline.cartoon_asset_library \
            examples/june-golden-scene-twelve-dollar-mug.json \
            concept/characters/june_oxley_asset_v8.json \
            --blender /opt/blender/blender \
            --ffmpeg ffmpeg \
            --performance-only \
            --performance-engine BLENDER_EEVEE_NEXT \
            --performance-samples 12 \
            --look-profile concept/style_frames/june_oxley_npr_look_v8.json \
            --performance-gate visemes \
            --output-dir asset-quality-out
          find asset-quality-out -maxdepth 3 -type f -print
      - name: Upload cheek-integrated viseme review
        uses: actions/upload-artifact@v4
        with:
          name: june-facial-oral-mask-visemes-v8
          path: |
            asset-quality-out/*.png
            asset-quality-out/*.mp4
            asset-quality-out/*.json
            asset-quality-out/plans/*.json
            asset-quality-out/assets/*.blend
          if-no-files-found: error
          retention-days: 14




