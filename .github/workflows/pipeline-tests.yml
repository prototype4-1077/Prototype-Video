name: Pipeline tests

on:
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/render.yml"
      - ".github/workflows/pipeline-tests.yml"
      - "concept/characters/june_oxley_asset_v5.json"
      - "concept/characters/june_oxley_asset_v6.json"
      - "concept/characters/june_oxley_asset_v7.json"
      - "concept/characters/june_oxley_asset_v8.json"
      - "concept/characters/june_oxley_performance_rig_v1.json"
      - "concept/style_frames/june_golden_scene_performance_slice_v1.json"
      - "concept/style_frames/june_golden_scene_rhubarb_lipsync_v1.json"
      - "concept/style_frames/june_golden_scene_expression_cues_v1.json"
      - "concept/style_frames/june_oxley_viseme_atlas_v1.json"
      - "concept/style_frames/june_oxley_viseme_atlas_v1.png"
      - "concept/style_frames/june_oxley_expression_atlas_v1.json"
      - "concept/style_frames/june_oxley_expression_atlas_v1.png"
      - "concept/style_frames/june_oxley_porch_hero_plate_v1.json"
      - "concept/style_frames/june_oxley_porch_hero_plate_v1.png"
      - "concept/style_frames/june_golden_scene_body_motion_v1.json"
      - "concept/style_frames/june_oxley_porch_gesture_atlas_v1.json"
      - "concept/style_frames/june_golden_scene_gesture_cues_v1.json"
      - "concept/style_frames/june_oxley_porch_mug_lift_low_v1.png"
      - "concept/style_frames/june_oxley_porch_mug_lift_mid_v1.png"
      - "concept/style_frames/june_oxley_porch_mug_lift_v1.png"
      - "concept/style_frames/june_oxley_porch_pencil_contact_v1.png"
      - "concept/style_frames/june_oxley_porch_pencil_hold_v1.png"
      - "concept/style_frames/june_golden_scene_multishot_v1.json"
      - "concept/style_frames/june_golden_scene_gs030_layered_stand_v1.json"
      - "concept/style_frames/june-golden-scene-gs030-*"
      - "concept/style_frames/june_gs030_pose_*"
      - "concept/style_frames/june_golden_scene_gs060_layered_pour_v1.json"
      - "concept/style_frames/june-golden-scene-gs060-*"
      - "concept/style_frames/june_gs060_pose_*"
      - "concept/style_frames/june_golden_scene_gs070_*"
      - "concept/style_frames/june-golden-scene-gs070-*"
      - "concept/style_frames/june_golden_scene_master_v1.json"
      - "concept/style_frames/june_golden_scene_master_sound_v1.json"
      - "concept/audio/june_golden_scene_dialogue_norman_v1.wav"
      - "concept/characters/june_oxley_performance_rig_v1.json"
      - "concept/style_frames/june_oxley_mug_held_insert_v1.png"
      - "concept/style_frames/june_oxley_ledger_insert_v1.png"
      - "concept/style_frames/june-golden-scene-gs020-style-target-v2.png"
      - "concept/style_frames/june-golden-scene-gs040-style-target-v2.png"
      - "concept/style_frames/june_oxley_npr_look_v1.json"
      - "concept/style_frames/june_oxley_npr_look_v2.json"
      - "concept/style_frames/june_oxley_npr_look_v3.json"
      - "concept/style_frames/june_oxley_npr_look_v4.json"
      - "concept/style_frames/june_oxley_npr_look_v5.json"
      - "concept/style_frames/june_oxley_npr_look_v6.json"
      - "concept/style_frames/june_oxley_npr_look_v7.json"
      - "concept/style_frames/june_oxley_npr_look_v8.json"
      - "concept/style_frames/june_oxley_npr_finish_v1.json"
      - "concept/style_frames/june_oxley_npr_reward_v1.json"
      - "examples/june-golden-scene-twelve-dollar-mug.json"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - ".github/workflows/render.yml"
      - ".github/workflows/pipeline-tests.yml"
      - "concept/style_frames/june_golden_scene_master_sound_v1.json"
      - "concept/audio/june_golden_scene_dialogue_norman_v1.wav"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Python deps
        run: pip install -q -r pipeline/requirements.txt
      - name: Compile pipeline
        run: python3 -m compileall -q pipeline
      - name: Regression tests
        run: python3 -m unittest discover -s pipeline/tests -v
      - name: Render high-fidelity 2.5D June viseme preview
        run: |
          python3 -m pipeline.cartoon_viseme_atlas \
            concept/style_frames/june_oxley_viseme_atlas_v1.json \
            --output-dir build/edit/june-2p5d-viseme-preview
      - name: Verify 2.5D preview contract
        run: |
          set -euo pipefail
          video=build/edit/june-2p5d-viseme-preview/june-2p5d-viseme-preview.mp4
          ffmpeg -v error -i "$video" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "836"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "836"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$video")" = "135"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")" = "4.500000"
          sha256sum "$video"
      - name: Upload high-fidelity 2.5D June preview
        uses: actions/upload-artifact@v4
        with:
          name: june-2p5d-viseme-atlas-v1
          path: |
            build/edit/june-2p5d-viseme-preview/*.mp4
            build/edit/june-2p5d-viseme-preview/*.json
            build/edit/june-2p5d-viseme-preview/frames/frame_0001.png
            build/edit/june-2p5d-viseme-preview/frames/frame_0135.png
          if-no-files-found: error
          retention-days: 14
      - name: Render exact-clock 2.5D June expression performance
        run: |
          python3 -m pipeline.cartoon_viseme_atlas \
            concept/style_frames/june_oxley_viseme_atlas_v1.json \
            --cues concept/style_frames/june_golden_scene_rhubarb_lipsync_v1.json \
            --expression-atlas concept/style_frames/june_oxley_expression_atlas_v1.json \
            --expression-cues concept/style_frames/june_golden_scene_expression_cues_v1.json \
            --output-dir build/edit/june-2p5d-lipsync-performance
      - name: Verify 453-frame expression performance contract
        run: |
          set -euo pipefail
          video=build/edit/june-2p5d-lipsync-performance/june-2p5d-lipsync-performance.mp4
          ffmpeg -v error -i "$video" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "836"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "836"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$video")" = "453"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")" = "15.100000"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
          sha256sum "$video"
      - name: Upload exact-clock 2.5D June expression performance
        uses: actions/upload-artifact@v4
        with:
          name: june-2p5d-expression-performance-v1
          path: |
            build/edit/june-2p5d-lipsync-performance/*.mp4
            build/edit/june-2p5d-lipsync-performance/*.json
            build/edit/june-2p5d-lipsync-performance/frames/frame_0001.png
            build/edit/june-2p5d-lipsync-performance/frames/frame_0453.png
          if-no-files-found: error
          retention-days: 14
      - name: Render full-HD June porch gesture performance
        run: |
          python3 -m pipeline.cartoon_hero_scene \
            concept/style_frames/june_oxley_porch_hero_plate_v1.json \
            concept/style_frames/june_oxley_viseme_atlas_v1.json \
            --cues concept/style_frames/june_golden_scene_rhubarb_lipsync_v1.json \
            --expression-atlas concept/style_frames/june_oxley_expression_atlas_v1.json \
            --expression-cues concept/style_frames/june_golden_scene_expression_cues_v1.json \
            --body-motion concept/style_frames/june_golden_scene_body_motion_v1.json \
            --gesture-atlas concept/style_frames/june_oxley_porch_gesture_atlas_v1.json \
            --gesture-cues concept/style_frames/june_golden_scene_gesture_cues_v1.json \
            --output-dir build/edit/june-hero-expression-performance
      - name: Verify full-HD June porch gesture contract
        run: |
          set -euo pipefail
          video=build/edit/june-hero-expression-performance/june-hero-expression-performance.mp4
          ffmpeg -v error -i "$video" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$video")" = "453"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")" = "15.100000"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
          test "$(find build/edit/june-hero-expression-performance/review_frames -name 'frame_*.png' | wc -l)" = "9"
          sha256sum "$video"
      - name: Upload full-HD June porch gesture performance
        uses: actions/upload-artifact@v4
        with:
          name: june-hero-gesture-performance-v1
          path: |
            build/edit/june-hero-expression-performance/*.mp4
            build/edit/june-hero-expression-performance/*.json
            build/edit/june-hero-expression-performance/review_frames/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Render high-detail June multi-shot sequence
        run: |
          python3 -m pipeline.cartoon_shot_sequence \
            concept/style_frames/june_golden_scene_multishot_v1.json \
            build/edit/june-hero-expression-performance/june-hero-expression-performance.mp4 \
            --output-dir build/edit/june-golden-scene-multishot
      - name: Verify high-detail multi-shot contract
        run: |
          set -euo pipefail
          video=build/edit/june-golden-scene-multishot/june-golden-scene-multishot.mp4
          report=build/edit/june-golden-scene-multishot/june-golden-scene-multishot-report.json
          ffmpeg -v error -i "$video" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$video")" = "453"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")" = "15.100000"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
          test "$(find build/edit/june-golden-scene-multishot/review_frames -name 'frame_*.png' | wc -l)" = "18"
          python3 - <<'PY'
          import json
          report = json.load(open("build/edit/june-golden-scene-multishot/june-golden-scene-multishot-report.json", encoding="utf-8"))
          assert report["gate"] == "identity_locked_high_detail_multishot_sequence"
          assert report["cut_frames"] == [51, 115, 307, 379, 393]
          assert len(report["shots"]) == 6
          assert report["base_performance"]["audio_preserved"] is False
          assert report["encoded_quality"]["minimum_psnr_db"] >= 38.0
          assert report["encoded_quality"]["minimum_encoded_laplacian_variance"] >= 30.0
          PY
          sha256sum "$video" "$report"
      - name: Upload high-detail June multi-shot sequence
        uses: actions/upload-artifact@v4
        with:
          name: june-golden-scene-multishot-v1
          path: |
            build/edit/june-golden-scene-multishot/*.mp4
            build/edit/june-golden-scene-multishot/*.json
            build/edit/june-golden-scene-multishot/review_frames/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Render registered GS030 layered stand
        run: |
          python3 -m pipeline.cartoon_pose_layers \
            concept/style_frames/june_golden_scene_gs030_layered_stand_v1.json \
            --output-dir build/edit/june-gs030-layered-stand
      - name: Verify registered GS030 layered stand contract
        run: |
          set -euo pipefail
          video=build/edit/june-gs030-layered-stand/june-gs030-layered-stand.mp4
          report=build/edit/june-gs030-layered-stand/june-gs030-layered-stand-report.json
          ffmpeg -v error -i "$video" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$video")" = "171"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")" = "5.700000"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
          test "$(find build/edit/june-gs030-layered-stand/review_frames -name 'frame_*.png' | wc -l)" = "14"
          python3 - <<'PY'
          import json
          report = json.load(open("build/edit/june-gs030-layered-stand/june-gs030-layered-stand-report.json", encoding="utf-8"))
          assert report["gate"] == "registered_layered_body_mechanics"
          assert report["frame_count"] == 171
          assert report["audio"]["included"] is False
          assert report["optical_flow_used"] is False
          assert report["cross_dissolve_used"] is False
          assert report["maximum_contact_residual_px_source"] <= 1.75
          assert report["encoded_quality"]["minimum_psnr_db"] >= 38.0
          assert report["encoded_quality"]["minimum_encoded_laplacian_variance"] >= 30.0
          assert len(report["review_frames"]) == 14
          PY
          sha256sum "$video" "$report"
      - name: Upload registered GS030 layered stand
        uses: actions/upload-artifact@v4
        with:
          name: june-gs030-layered-stand-v1
          path: |
            build/edit/june-gs030-layered-stand/*.mp4
            build/edit/june-gs030-layered-stand/*.json
            build/edit/june-gs030-layered-stand/review_frames/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Render registered GS060 layered pour
        run: |
          python3 -m pipeline.cartoon_pour_layers \
            concept/style_frames/june_golden_scene_gs060_layered_pour_v1.json \
            --output-dir build/edit/june-gs060-layered-pour
      - name: Verify registered GS060 layered pour contract
        run: |
          set -euo pipefail
          video=build/edit/june-gs060-layered-pour/june-gs060-layered-pour.mp4
          report=build/edit/june-gs060-layered-pour/june-gs060-layered-pour-report.json
          ffmpeg -v error -i "$video" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$video")" = "258"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")" = "8.600000"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
          test "$(find build/edit/june-gs060-layered-pour/review_frames -name 'frame_*.png' | wc -l)" = "22"
          python3 - <<'PY'
          import json
          report = json.load(open("build/edit/june-gs060-layered-pour/june-gs060-layered-pour-report.json", encoding="utf-8"))
          assert report["gate"] == "registered_pour_contact_and_liquid"
          assert report["frame_count"] == 258
          assert report["audio"]["included"] is False
          assert report["optical_flow_used"] is False
          assert report["cross_dissolve_used"] is False
          assert report["paid_runtime_generation_used"] is False
          assert report["maximum_mug_residual_px_source"] <= 0.01
          assert report["grounded_pot_contact"]["maximum_residual_px_source"] <= 24.0
          assert len(report["grounded_pot_contact"]["poses"]) == 3
          assert report["liquid"]["reference_runtime_consumed"] is False
          assert report["liquid"]["maximum_spout_start_error_px_source"] <= 0.01
          assert report["liquid"]["maximum_rendered_spill_pixels_source"] == 0
          assert report["liquid"]["landing_ellipse_value"] <= 0.8
          assert report["visibility_audit"]["support_foot"] is False
          assert "GS030" in report["visibility_audit"]["support_foot_remediation"]
          assert report["encoded_quality"]["decoded_frame_count"] == 258
          assert report["encoded_quality"]["minimum_psnr_db"] >= 38.0
          assert report["encoded_quality"]["minimum_encoded_laplacian_variance"] >= 30.0
          assert len(report["review_frames"]) == 22
          PY
          sha256sum "$video" "$report"
      - name: Upload registered GS060 layered pour
        uses: actions/upload-artifact@v4
        with:
          name: june-gs060-layered-pour-v1
          path: |
            build/edit/june-gs060-layered-pour/*.mp4
            build/edit/june-gs060-layered-pour/*.json
            build/edit/june-gs060-layered-pour/review_frames/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Render registered GS070 resolution performance
        run: |
          python3 -m pipeline.cartoon_resolution_scene \
            concept/style_frames/june_golden_scene_gs070_resolution_v1.json \
            concept/style_frames/june_oxley_viseme_atlas_v1.json \
            --cues concept/style_frames/june_golden_scene_gs070_rhubarb_v1.json \
            --expression-atlas concept/style_frames/june_oxley_expression_atlas_v1.json \
            --expression-cues concept/style_frames/june_golden_scene_gs070_expression_v1.json \
            --body-motion concept/style_frames/june_golden_scene_gs070_body_motion_v1.json \
            --output-dir build/edit/june-gs070-resolution
      - name: Verify registered GS070 resolution contract
        run: |
          set -euo pipefail
          video=build/edit/june-gs070-resolution/june-gs070-resolution.mp4
          report=build/edit/june-gs070-resolution/june-gs070-resolution-report.json
          ffmpeg -v error -i "$video" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$video")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$video")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$video")" = "228"
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$video")" = "7.600000"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
          test "$(find build/edit/june-gs070-resolution/review_frames -name 'frame_*.png' | wc -l)" = "12"
          python3 - <<'PY'
          import json
          report = json.load(open("build/edit/june-gs070-resolution/june-gs070-resolution-report.json", encoding="utf-8"))
          assert report["gate"] == "gs070_registered_resolution_production_pixels"
          assert report["shot_id"] == "GS070"
          assert report["frame_count"] == 228
          assert report["audio"] is None
          assert report["sequence"]["transition"] == "hard_cut_on_frame_46"
          assert report["sequence"]["interpolated_source_frames"] == 0
          assert report["final_hold"]["start_frame"] == 202
          assert report["final_hold"]["frame_count"] == 27
          assert report["final_hold"]["body_locked"] is True
          assert report["final_hold"]["secondary_motion_live"] is True
          assert len(report["production_pixel_sources"]) == 2
          assert report["encoded_quality"]["minimum_psnr_db"] >= 38.0
          assert report["encoded_quality"]["minimum_encoded_laplacian_variance"] >= 30.0
          assert len(report["review_frames"]) == 12
          PY
          sha256sum "$video" "$report"
      - name: Upload registered GS070 resolution performance
        uses: actions/upload-artifact@v4
        with:
          name: june-gs070-resolution-v1
          path: |
            build/edit/june-gs070-resolution/*.mp4
            build/edit/june-gs070-resolution/*.json
            build/edit/june-gs070-resolution/review_frames/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Assemble exact 38.8-second Golden Scene picture master
        run: |
          python3 -m pipeline.cartoon_golden_master \
            concept/style_frames/june_golden_scene_master_v1.json \
            --gs030-video build/edit/june-gs030-layered-stand/june-gs030-layered-stand.mp4 \
            --gs030-report build/edit/june-gs030-layered-stand/june-gs030-layered-stand-report.json \
