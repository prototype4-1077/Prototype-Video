name: Render Can You Fly

on:
  push:
    paths:
      - "build/can-you-fly/render.trigger"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact visual plan
        run: python3 pipeline/visual_symbols.py validate build/can-you-fly

  render:
    needs: validate
    uses: ./.github/workflows/render.yml
    with:
      slug: can-you-fly
    secrets: inherit
