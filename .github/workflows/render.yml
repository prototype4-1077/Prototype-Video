name: Render video
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Build slug (expects build/<slug>/script.json in the repo; optional vo.mp3 next to it)"
        required: true
  workflow_call:
    inputs:
      slug:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: render-${{ inputs.slug }}   # same slug never runs twice at once
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore connector-uploaded voiceover
        shell: bash
        run: |
          shopt -s nullglob
          parts=(build/${{ inputs.slug }}/vo.mp3.b64.part*)
          if ((${#parts[@]})); then
            cat "${parts[@]}" | base64 --decode > "build/${{ inputs.slug }}/vo.mp3"
          fi

      - name: Restore connector-uploaded visual assets
        shell: bash
        run: |
          shopt -s nullglob
          for encoded in build/${{ inputs.slug }}/*.b64; do
            target="${encoded%.b64}"
            base64 --decode "$encoded" > "$target"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache models (whisper, CLIP, depth)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/clipcache
            /tmp/models
          key: models-v1

      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Python deps
        run: pip install -q -r pipeline/requirements.txt

      - name: Pipeline regression tests
        run: python3 -m unittest discover -s pipeline/tests -v

      - name: API keys from repo secrets
        run: |
          printf 'ELEVENLABS_API_KEY=%s\nPEXELS_API_KEY=%s\nELEVENLABS_VOICE_ID=%s\n' \
            "${{ secrets.ELEVENLABS_API_KEY }}" "${{ secrets.PEXELS_API_KEY }}" \
            "${{ secrets.ELEVENLABS_VOICE_ID || 'TX3LPaxmHKxFdv7VOQHJ' }}" > pipeline/.env

      - name: Build until DONE (no sandbox time limits here)
        env:
          SEMANTIC_CLIP: "1"   # CLIP semantic footage matching ON in CI
        run: |
          for i in $(seq 1 200); do
            out=$(python3 pipeline/build.py "build/${{ inputs.slug }}" 2>&1) || { echo "$out"; exit 1; }
            echo "$out"
            case "$out" in *DONE*) break;; esac
          done
          test -f "build/${{ inputs.slug }}/final.mp4"

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.slug }}
          path: |
            build/${{ inputs.slug }}/final*.mp4
            build/${{ inputs.slug }}/alts_sheet.jpg
            build/${{ inputs.slug }}/motion_report.json
            build/${{ inputs.slug }}/motion_report_short.json
            build/${{ inputs.slug }}/visual_symbol_report.json
            build/${{ inputs.slug }}/still_reference_report.json
            build/${{ inputs.slug }}/CREDITS.txt

      - name: Publish permanent Release (artifacts expire after 90 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-${{ inputs.slug }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "${{ inputs.slug }}" \
              --notes "Rendered $(date -u +%F) by run ${{ github.run_id }}"
          gh release upload "$TAG" \
            "build/${{ inputs.slug }}/final.mp4#${{ inputs.slug }}.mp4" --clobber
          test -f "build/${{ inputs.slug }}/final_short.mp4" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/final_short.mp4#${{ inputs.slug }}-60s.mp4" --clobber || true
          test -f "build/${{ inputs.slug }}/alts_sheet.jpg" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/alts_sheet.jpg" --clobber || true
          test -f "build/${{ inputs.slug }}/CREDITS.txt" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/CREDITS.txt" --clobber || true
          test -f "build/${{ inputs.slug }}/visual_symbol_report.json" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/visual_symbol_report.json" --clobber || true
          test -f "build/${{ inputs.slug }}/still_reference_report.json" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/still_reference_report.json" --clobber || true

      - name: Commit updated memory + script timings
        run: |
          rm -f pipeline/.env
          printf '%s\n' "${{ github.run_id }}" > "build/${{ inputs.slug }}/run-id.txt"
          git config user.name "render-bot" && git config user.email "render@users.noreply.github.com"
          for f in pipeline/memory.json "build/${{ inputs.slug }}/script.json" "build/${{ inputs.slug }}/run-id.txt" "build/${{ inputs.slug }}/alts.json" "build/${{ inputs.slug }}"/emb_*.npy; do
            git add "$f" 2>/dev/null || true
          done
          git commit -m "render ${{ inputs.slug }}: update memory + timings" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push && break
            git stash --include-untracked || true
            git pull --rebase origin main || git rebase --abort || true
            git stash pop || true
          done
