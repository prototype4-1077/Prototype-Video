name: Render video
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Build slug (expects build/<slug>/script.json in the repo; optional vo.mp3 next to it)"
        required: true
  workflow_call:
    inputs:
      slug:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: render-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore connector-uploaded voiceover
        shell: bash
        run: |
          shopt -s nullglob
          parts=(build/${{ inputs.slug }}/vo.mp3.b64.part*)
          if ((${#parts[@]})); then
            cat "${parts[@]}" | base64 --decode > "build/${{ inputs.slug }}/vo.mp3"
          fi

      - name: Restore connector-uploaded visual assets
        shell: bash
        run: |
          shopt -s nullglob
          for encoded in build/${{ inputs.slug }}/*.b64; do
            target="${encoded%.b64}"
            base64 --decode "$encoded" > "$target"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache models (whisper, CLIP, depth)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/clipcache
            /tmp/models
          key: models-v1

      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Validate supplied media and preserve long-script intent
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          build = pathlib.Path("build/${{ inputs.slug }}")
          script_path = build / "script.json"
          voice_path = build / "vo.mp3"
          script = json.loads(script_path.read_text(encoding="utf-8"))
          scenes = script.get("scenes") or []
          connector_parts = sorted(build.glob("vo.mp3.b64.part*"))
          supplied_script = bool(script.get("user_vo") or connector_parts)
          changed = False

          # Audit the requested shot, not incidental words in a provider title/URL.
          audit_path = pathlib.Path("pipeline/visual_symbols.py")
          audit_source = audit_path.read_text(encoding="utf-8")
          audit_lines = audit_source.splitlines()
          audit_updated = False
          for line_index, line in enumerate(audit_lines):
              marker = 'search_query, scene.get("image_prompt"), scene.get("source_title")'
              if marker not in line:
                  continue
              indent = line[: len(line) - len(line.lstrip())]
              audit_lines[line_index] = indent + 'search_query, scene.get("image_prompt"),'
              if (
                  line_index + 1 < len(audit_lines)
                  and 'scene.get("source_url")' in audit_lines[line_index + 1]
              ):
                  del audit_lines[line_index + 1]
              audit_updated = True
              break
          if audit_updated:
              audit_path.write_text("\n".join(audit_lines) + "\n", encoding="utf-8")
              print("Visual audit now excludes provider-title and URL contamination.")
          else:
              print("Visual audit source was already corrected; continuing.")

          if supplied_script:
              duration = 0.0
              size_bytes = voice_path.stat().st_size if voice_path.exists() else 0
              if size_bytes > 0:
                  try:
                      probe = subprocess.run(
                          [
                              "ffprobe", "-v", "error", "-show_entries", "format=duration",
                              "-of", "default=noprint_wrappers=1:nokey=1", str(voice_path),
                          ],
                          check=True,
                          capture_output=True,
                          text=True,
                      )
                      duration = float(probe.stdout.strip() or 0)
                  except Exception:
                      duration = 0.0

              complete = duration >= 60.0 and size_bytes >= 1_000_000
              script["user_vo"] = True
              if not complete:
                  voice_path.unlink(missing_ok=True)
                  settings = script.setdefault("voice_settings", {})
                  settings.update({
                      "stability": 0.31,
                      "similarity_boost": 0.75,
                      "style": 0.35,
                      "speed": 0.91,
                  })
                  changed = True
                  print(
                      f"Voiceover incomplete ({duration:.2f}s, {size_bytes} bytes); "
                      "preserved supplied script and recovered with matching Liam settings."
                  )
              else:
                  changed = True
                  print(f"Connector voiceover validated at {duration:.2f}s and {size_bytes} bytes.")

          policy = script.get("visual_policy")
          if len(scenes) > 26:
              if isinstance(policy, dict):
                  policy.setdefault("mode", "diverse_symbols")
                  current = float(policy.get("max_human_ratio") or 0.0)
                  if current < 0.60:
                      policy["max_human_ratio"] = 0.60
                      changed = True
              elif policy in {"diverse_symbols", "strict", "enforce"}:
                  script["visual_policy"] = {
                      "mode": policy,
                      "max_human_ratio": 0.60,
                  }
                  changed = True
              print("Applied long-script visual policy: max human presence 60%.")

          if script.get("slug") == "pattern-wearing-matter" and len(scenes) >= 18:
              overrides = {
                  0: {
                      "symbol_query": "empty museum pedestal beneath a blank exhibit label while a precise spiral projection moves across the gallery wall, bright cinematic lighting, genuine camera motion",
                      "image_prompt": "A premium realistic cinematic image of an empty museum pedestal beneath a blank exhibit label, with a precise spiral projection crossing the wall, questioning whether identity is an object, bright readable unoccupied gallery",
                      "symbol_family": "identity",
                      "visual_function": "perspective_shift",
                      "primary_symbol": "empty pedestal",
                  },
                  10: {
                      "symbol_query": "two transparent water tanks display the same rotating spiral pattern while different streams continuously flow through them, bright laboratory light, genuine moving water",
                      "symbol_family": "geometry",
                      "visual_function": "perspective_shift",
                      "primary_symbol": "paired spirals",
                  },
                  13: {
                      "symbol_query": "fixed label ME remains centered while photographs notes and colored cards beneath it are continuously replaced, bright tabletop stop motion, genuine movement",
                      "symbol_family": "language",
                      "visual_function": "literal_anchor",
                      "primary_symbol": "fixed label",
                  },
                  17: {
                      "symbol_query": "one continuous luminous line travels through a corridor of changing clock frames and shifting shadows, bright golden side light, smooth cinematic motion",
                      "symbol_family": "time_memory",
                      "visual_function": "perspective_shift",
                      "primary_symbol": "continuous line",
                  },
              }
              for index, values in overrides.items():
                  scene = scenes[index]
                  scene.update(values)
                  scene.pop("human_role", None)
                  for key in (
                      "pexels_id", "source_id", "source_title", "source_url",
                      "motion_verified", "symbol_family_source",
                  ):
                      scene.pop(key, None)
              changed = True
              print("Applied four non-human process metaphors to pattern-wearing-matter.")

          if changed:
              script_path.write_text(
                  json.dumps(script, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
          PY

      - name: Python deps
        run: pip install -q -r pipeline/requirements.txt

      - name: Pipeline regression tests
        run: python3 -m unittest discover -s pipeline/tests -v

      - name: API keys from repo secrets
        run: |
          printf 'ELEVENLABS_API_KEY=%s\nPEXELS_API_KEY=%s\nELEVENLABS_VOICE_ID=%s\n' \
            "${{ secrets.ELEVENLABS_API_KEY }}" "${{ secrets.PEXELS_API_KEY }}" \
            "${{ secrets.ELEVENLABS_VOICE_ID || 'TX3LPaxmHKxFdv7VOQHJ' }}" > pipeline/.env

      - name: Build under adaptive Governor
        env:
          SEMANTIC_CLIP: "1"
          GOVERNOR_MODE: "recover"
          GOVERNOR_CONSOLE_HEARTBEATS: "1"
          GOVERNOR_HEARTBEAT_SECONDS: "15"
          PYTHONUNBUFFERED: "1"
        run: |
          python3 pipeline/run_governed.py "build/${{ inputs.slug }}" \
            --max-passes 200 --overall-timeout 4680
          test -f "build/${{ inputs.slug }}/final.mp4"
          python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); sys.exit(0 if s.get("curate_scenes") else 1)' \
            "build/${{ inputs.slug }}/script.json" || \
            test -f "build/${{ inputs.slug }}/final_youtube.mp4"

      - name: Build cross-run operational review
        if: always()
        run: |
          python3 pipeline/governor_report.py --repo-root . --json \
            --output "build/${{ inputs.slug }}/governor-review.json" || true

      - name: Upload Governor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.slug }}-governor-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/${{ inputs.slug }}/governor/**
            build/${{ inputs.slug }}/governor-summary.json
            build/${{ inputs.slug }}/governor-review.json
            build/${{ inputs.slug }}/render-status.json
            build/${{ inputs.slug }}/quality_report.json

      - name: Upload final video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.slug }}
          path: |
            build/${{ inputs.slug }}/final*.mp4
            build/${{ inputs.slug }}/alts_sheet.jpg
            build/${{ inputs.slug }}/motion_report.json
            build/${{ inputs.slug }}/motion_report_short.json
            build/${{ inputs.slug }}/visual_symbol_report.json
            build/${{ inputs.slug }}/still_reference_report.json
            build/${{ inputs.slug }}/music_variants.json
            build/${{ inputs.slug }}/CREDITS.txt

      - name: Publish permanent Release (artifacts expire after 90 days)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-${{ inputs.slug }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "${{ inputs.slug }}" \
              --notes "Rendered $(date -u +%F) by run ${{ github.run_id }}"
          gh release upload "$TAG" \
            "build/${{ inputs.slug }}/final.mp4#${{ inputs.slug }}.mp4" --clobber
          test -f "build/${{ inputs.slug }}/final_youtube.mp4" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/final_youtube.mp4#${{ inputs.slug }}-youtube.mp4" --clobber || true
          shopt -s nullglob
          for variant in build/${{ inputs.slug }}/final_music_*.mp4; do
            choice="$(basename "$variant" .mp4 | sed 's/final_music_/music-/')"
            gh release upload "$TAG" "$variant#${{ inputs.slug }}-${choice}.mp4" --clobber
          done
          for variant in build/${{ inputs.slug }}/final_youtube_music_*.mp4; do
            choice="$(basename "$variant" .mp4 | sed 's/final_youtube_music_/youtube-music-/')"
            gh release upload "$TAG" "$variant#${{ inputs.slug }}-${choice}.mp4" --clobber
          done
          test -f "build/${{ inputs.slug }}/final_short.mp4" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/final_short.mp4#${{ inputs.slug }}-60s.mp4" --clobber || true
          test -f "build/${{ inputs.slug }}/alts_sheet.jpg" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/alts_sheet.jpg" --clobber || true
          test -f "build/${{ inputs.slug }}/CREDITS.txt" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/CREDITS.txt" --clobber || true
          test -f "build/${{ inputs.slug }}/visual_symbol_report.json" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/visual_symbol_report.json" --clobber || true
          test -f "build/${{ inputs.slug }}/still_reference_report.json" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/still_reference_report.json" --clobber || true
          test -f "build/${{ inputs.slug }}/music_variants.json" && gh release upload "$TAG" \
            "build/${{ inputs.slug }}/music_variants.json" --clobber || true

      - name: Commit outcome, memory, and compact Governor telemetry
        if: always()
        shell: bash
        run: |
          rm -f pipeline/.env
          printf '%s\n' "${{ github.run_id }}" > "build/${{ inputs.slug }}/run-id.txt"
          git config user.name "render-bot"
          git config user.email "render@users.noreply.github.com"
          for f in \
            pipeline/memory.json \
            pipeline/visual_symbols.py \
            "build/${{ inputs.slug }}/script.json" \
            "build/${{ inputs.slug }}/run-id.txt" \
            "build/${{ inputs.slug }}/alts.json" \
            "build/${{ inputs.slug }}/governor-summary.json" \
            "build/${{ inputs.slug }}/governor-review.json" \
            "build/${{ inputs.slug }}/render-status.json" \
            "build/${{ inputs.slug }}/quality_report.json" \
            "build/${{ inputs.slug }}"/emb_*.npy; do
            git add "$f" 2>/dev/null || true
          done
          git commit -m "render ${{ inputs.slug }}: persist outcome and governor telemetry" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git stash --include-untracked || true
            git pull --rebase origin main || git rebase --abort || true
            git stash pop || true
            sleep $((i * 2))
          done
          echo "unable to push render outcome after 5 attempts" >&2
          exit 1