name: Render Mirror to Mirror

on:
  push:
    branches:
      - main
    paths:
      - build/mirror-to-mirror/render.trigger

permissions:
  contents: write

jobs:
  render:
    permissions:
      contents: write
    uses: ./.github/workflows/render.yml
    with:
      slug: mirror-to-mirror
    secrets: inherit

  record-status:
    if: ${{ always() }}
    needs:
      - render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record caller status
        shell: bash
        run: |
          mkdir -p build/mirror-to-mirror
          printf '%s\n' '${{ github.run_id }}' > build/mirror-to-mirror/caller-run-id.txt
          printf '%s\n' '${{ needs.render.result }}' > build/mirror-to-mirror/caller-conclusion.txt
          git config user.name render-bot
          git config user.email render@users.noreply.github.com
          git add build/mirror-to-mirror/caller-run-id.txt build/mirror-to-mirror/caller-conclusion.txt
          git commit -m 'render mirror-to-mirror: record status' || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
          done
          exit 1
