name: Render Other Versions Stock First Rebuild

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first-rebuild/render.request"
  workflow_dispatch:

permissions:
  contents: write

env:
  SLUG: other-versions-stock-first-rebuild
  EXPECTED_AUDIO_SHA256: 2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa
  EXPECTED_AUDIO_SIZE: "1135634"
  EXPECTED_AUDIO_DURATION: "68.754250"

concurrency:
  group: render-other-versions-stock-first-rebuild
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/clipcache
            /tmp/models
          key: models-v1

      - name: System dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Recover and verify the exact attached narration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          build = pathlib.Path("build") / os.environ["SLUG"]
          build.mkdir(parents=True, exist_ok=True)
          expected_sha = os.environ["EXPECTED_AUDIO_SHA256"]
          expected_size = int(os.environ["EXPECTED_AUDIO_SIZE"])
          destination = build / "vo.mp3"
          found_from = None

          def valid(data: bytes) -> bool:
              return len(data) == expected_size and hashlib.sha256(data).hexdigest() == expected_sha

          # First try exact binary blobs from any repository revision.
          objects = subprocess.run(
              ["git", "rev-list", "--objects", "--all"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          seen = set()
          for line in objects:
              sha, _, path = line.partition(" ")
              if not path or sha in seen:
                  continue
              seen.add(sha)
              lower = path.lower()
              if not (lower.endswith(".mp3") or "voice" in lower or "/vo" in lower):
                  continue
              try:
                  size = int(subprocess.run(
                      ["git", "cat-file", "-s", sha], check=True,
                      capture_output=True, text=True,
                  ).stdout.strip())
              except Exception:
                  continue
              if size != expected_size:
                  continue
              data = subprocess.run(
                  ["git", "cat-file", "blob", sha], check=True, capture_output=True,
              ).stdout
              if valid(data):
                  destination.write_bytes(data)
                  found_from = f"git-blob:{sha}:{path}"
                  break

          # Then try every complete base64-part package visible in repository history.
          if found_from is None:
              commits = subprocess.run(
                  ["git", "rev-list", "--all"], check=True,
                  capture_output=True, text=True,
              ).stdout.splitlines()
              checked_signatures = set()
              for commit in commits:
                  names = subprocess.run(
                      ["git", "ls-tree", "-r", "--name-only", commit],
                      check=True, capture_output=True, text=True,
                  ).stdout.splitlines()
                  groups: dict[str, list[str]] = {}
                  for name in names:
                      if re.search(r"(?:vo|voice).*\.b64\.part\d+$", name, re.I):
                          prefix = re.sub(r"\.part\d+$", "", name)
                          groups.setdefault(prefix, []).append(name)
                  for prefix, paths in groups.items():
                      paths.sort()
                      signature = tuple(paths)
                      if signature in checked_signatures:
                          continue
                      checked_signatures.add(signature)
                      try:
                          encoded = b"".join(
                              subprocess.run(
                                  ["git", "show", f"{commit}:{path}"],
                                  check=True, capture_output=True,
                              ).stdout.strip()
                              for path in paths
                          )
                          data = base64.b64decode(encoded, validate=True)
                      except Exception:
                          continue
                      if valid(data):
                          destination.write_bytes(data)
                          found_from = f"git-parts:{commit}:{prefix}:{len(paths)}"
                          break
                  if found_from is not None:
                      break

          if found_from is None:
              raise SystemExit(
                  "Exact attached MP3 was not recoverable byte-for-byte; stopping before rendering."
              )

          actual = destination.read_bytes()
          verification = {
              "source_attachment": "ElevenLabs_2026-07-16T14_35_48_Liam - Energetic, Social Media Creator_pre_sp100_s50_sb75_v3 (1)(1).mp3",
              "recovered_from": found_from,
              "sha256": hashlib.sha256(actual).hexdigest(),
              "size_bytes": len(actual),
              "exact_bytes_restored": True,
              "transcoded_before_pipeline": False,
              "pipeline_voiceover_path": "vo.mp3",
          }
          (build / "audio-verification.json").write_text(
              json.dumps(verification, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(verification, indent=2))
          PY

          actual_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "build/$SLUG/vo.mp3")"
          python3 - "$actual_duration" "$EXPECTED_AUDIO_DURATION" <<'PY'
          import sys
          actual = float(sys.argv[1])
          expected = float(sys.argv[2])
          if abs(actual - expected) > 0.001:
              raise SystemExit(f"Exact audio duration mismatch: {actual:.6f} != {expected:.6f}")
          print(f"Exact attached narration verified at {actual:.6f} seconds")
          PY

      - name: Clean every inherited or generated scene asset
        shell: bash
        run: |
          set -euo pipefail
          find "build/$SLUG" -maxdepth 1 -type f \( \
            -name 'clip_*.mp4' -o -name 'seg_*.mp4' -o -name 'seg_youtube_*.mp4' -o \
            -name 'final*.mp4' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o \
            -name 'enhanced_still_*' -o -name 'stock_reference_*' -o -name 'words*.json' -o \
            -name 'alts.json' -o -name 'scene-review.*' -o -name 'motion_report*.json' -o \
            -name 'visual_symbol_report.json' -o -name 'still_reference_report.json' -o \
            -name 'music_variants.json' -o -name 'quality_report.json' \
          \) -delete
          test -s "build/$SLUG/vo.mp3"
          test -s "build/$SLUG/script.json"

      - name: Python dependencies
        run: pip install -q -r pipeline/requirements.txt

      - name: Pipeline regression tests
        run: python3 -m unittest discover -s pipeline/tests -v

      - name: Record the stock-first correction as durable taste feedback
        run: |
          python3 pipeline/learn.py note "Other Versions of You was fully rejected. For ordinary videos, begin with genuine literal stock footage for every scene. Do not use deterministic symbolic graphics, generic low-grade graphics, hero images, or stills unless an exact stock search has genuinely failed and James explicitly accepts a much higher-grade fallback. Narrative correspondence and premium photographic realism outrank abstract visual cleverness."

      - name: API keys
        shell: bash
        run: |
          printf 'ELEVENLABS_API_KEY=%s\nPEXELS_API_KEY=%s\nELEVENLABS_VOICE_ID=%s\n' \
            "${{ secrets.ELEVENLABS_API_KEY }}" "${{ secrets.PEXELS_API_KEY }}" \
            "${{ secrets.ELEVENLABS_VOICE_ID || 'TX3LPaxmHKxFdv7VOQHJ' }}" > pipeline/.env

      - name: Build with the TikTok Video Pipeline
        env:
          SEMANTIC_CLIP: "1"
          GOVERNOR_MODE: "recover"
          GOVERNOR_CONSOLE_HEARTBEATS: "1"
          GOVERNOR_HEARTBEAT_SECONDS: "15"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "build/$SLUG/vo.mp3" | awk '{print $1}')" = "$EXPECTED_AUDIO_SHA256"
          python3 pipeline/run_governed.py "build/$SLUG" --max-passes 200 --overall-timeout 4680
          test -s "build/$SLUG/final.mp4"
          test -s "build/$SLUG/scene-review.html"
          test -s "build/$SLUG/scene-review.json"
          test -s "build/$SLUG/music_variants.json"
          dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "build/$SLUG/final.mp4")"
          test "$dims" = "1080x1920"

      - name: Enforce genuine stock footage for every scene
        run: python3 "build/$SLUG/verify_stock_only.py"

      - name: Upload finished stock-only delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: other-versions-stock-first-rebuild
          retention-days: 30
          path: |
            build/${{ env.SLUG }}/final.mp4
            build/${{ env.SLUG }}/scene-review.html
            build/${{ env.SLUG }}/scene-review.json
            build/${{ env.SLUG }}/music_variants.json
            build/${{ env.SLUG }}/motion_report.json
            build/${{ env.SLUG }}/visual_symbol_report.json
            build/${{ env.SLUG }}/still_reference_report.json
            build/${{ env.SLUG }}/quality_report.json
            build/${{ env.SLUG }}/stock-only-report.json
            build/${{ env.SLUG }}/audio-verification.json
            build/${{ env.SLUG }}/alts_sheet.jpg
            build/${{ env.SLUG }}/alts.json
            build/${{ env.SLUG }}/CREDITS.txt

      - name: Publish permanent release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="video-$SLUG"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Other Versions of You — Stock First Rebuild" \
              --notes "Fresh stock-only TikTok Pipeline render using the exact attached MP3. Run $GITHUB_RUN_ID."
          for file in \
            "build/$SLUG/final.mp4" \
            "build/$SLUG/scene-review.html" \
            "build/$SLUG/scene-review.json" \
            "build/$SLUG/music_variants.json" \
            "build/$SLUG/motion_report.json" \
            "build/$SLUG/visual_symbol_report.json" \
            "build/$SLUG/still_reference_report.json" \
            "build/$SLUG/quality_report.json" \
            "build/$SLUG/stock-only-report.json" \
            "build/$SLUG/audio-verification.json" \
            "build/$SLUG/alts_sheet.jpg" \
            "build/$SLUG/CREDITS.txt"; do
            test -f "$file" && gh release upload "$tag" "$file" --clobber
          done

      - name: Persist pipeline learning and review metadata
        if: always()
        shell: bash
        run: |
          rm -f pipeline/.env "build/$SLUG/vo.mp3"
          printf '%s\n' "$GITHUB_RUN_ID" > "build/$SLUG/run-id.txt"
          git config user.name "render-bot"
          git config user.email "render@users.noreply.github.com"
          for file in \
            pipeline/memory.json \
            "build/$SLUG/script.json" \
            "build/$SLUG/run-id.txt" \
            "build/$SLUG/audio-verification.json" \
            "build/$SLUG/stock-only-report.json" \
            "build/$SLUG/render-status.json" \
            "build/$SLUG/quality_report.json" \
            "build/$SLUG/scene-review.json" \
            "build/$SLUG/alts.json" \
            "build/$SLUG/governor-summary.json" \
            "build/$SLUG/governor-review.json"; do
            git add "$file" 2>/dev/null || true
          done
          git commit -m "render $SLUG: persist stock-first outcome" || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git stash --include-untracked || true
            git pull --rebase origin main || git rebase --abort || true
            git stash pop || true
            sleep $((i * 2))
          done
          exit 1
