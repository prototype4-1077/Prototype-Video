name: Render room-before-birth revision request

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - edited

permissions:
  contents: write
  actions: write

jobs:
  mark-start:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/render-room-before-birth-scenes-2-5') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.number == 6 &&
       github.event.pull_request.title == '[render] Room Before Birth scenes 2 and 5')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record caller run
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > build/room-before-birth/comment-render-started.txt
          git config user.name "render-request-bot"
          git config user.email "render-request@users.noreply.github.com"
          git add build/room-before-birth/comment-render-started.txt
          git commit -m "render room-before-birth revision: started $GITHUB_RUN_ID"
          git push

  render:
    needs: mark-start
    uses: ./.github/workflows/render.yml
    with:
      slug: room-before-birth
    secrets: inherit

  delivery:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Download render outputs
        uses: actions/download-artifact@v4
        with:
          name: room-before-birth
          path: delivery

      - name: Verify selected Deep Portal outputs
        shell: bash
        run: |
          test -f delivery/final_music_03.mp4
          test -f delivery/final_youtube_music_03.mp4

      - name: Upload portrait delivery
        uses: actions/upload-artifact@v4
        with:
          name: room-before-birth-delivery-portrait
          path: delivery/final_music_03.mp4
          retention-days: 30

      - name: Upload widescreen delivery
        uses: actions/upload-artifact@v4
        with:
          name: room-before-birth-delivery-youtube
          path: delivery/final_youtube_music_03.mp4
          retention-days: 30

      - name: Upload delivery QA
        uses: actions/upload-artifact@v4
        with:
          name: room-before-birth-delivery-qa
          if-no-files-found: ignore
          retention-days: 30
          path: |
            delivery/motion_report.json
            delivery/visual_symbol_report.json
            delivery/still_reference_report.json
            delivery/music_variants.json
            delivery/CREDITS.txt
