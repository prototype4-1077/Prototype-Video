name: Diagnose stock-slide voice package

on:
  push:
    branches: [main]
    paths:
      - "build/**/diagnosevoice.request"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Inspect every stored voice chunk
        shell: bash
        run: |
          file="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^build/[^/]+/diagnosevoice\.request$' | head -n 1)"
          slug="${file#build/}"
          slug="${slug%/diagnosevoice.request}"
          export BD="build/$slug"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re
          bd = pathlib.Path(os.environ["BD"])
          script = json.loads((bd / "script.json").read_text(encoding="utf-8"))
          expected = script["voice_source"]
          source = pathlib.Path("build") / expected["source_build"]
          all_parts = sorted(source.glob("vo.mp3.b64.part*"))
          numeric_pattern = re.compile(r"vo\.mp3\.b64\.part\d{3}$")
          numeric = [p for p in all_parts if numeric_pattern.search(p.name)]
          rows = []
          for path in all_parts:
              text = path.read_text(encoding="ascii").strip()
              rows.append({"name": path.name, "chars": len(text), "sha256": hashlib.sha256(text.encode()).hexdigest()})
          def decode(paths):
              encoded = "".join(p.read_text(encoding="ascii").strip() for p in paths)
              try:
                  raw = base64.b64decode(encoded, validate=True)
                  return {"count": len(paths), "names": [p.name for p in paths], "base64_chars": len(encoded), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest(), "error": None}
              except Exception as exc:
                  return {"count": len(paths), "names": [p.name for p in paths], "base64_chars": len(encoded), "bytes": 0, "sha256": None, "error": str(exc)}
          report = {
              "expected": expected,
              "source": str(source),
              "parts": rows,
              "numeric_decode": decode(numeric),
              "all_parts_decode": decode(all_parts),
          }
          target = bd / "voice-restore-diagnostic.json"
          target.write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          file="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^build/[^/]+/diagnosevoice\.request$' | head -n 1)"
          slug="${file#build/}"
          slug="${slug%/diagnosevoice.request}"
          git config user.name "voice-diagnostic-bot"
          git config user.email "render@users.noreply.github.com"
          git add "build/$slug/voice-restore-diagnostic.json"
          git commit -m "diagnose $slug: voice chunks"
          git push
