name: Diagnose Other Versions Stock V2

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/diagnose-stock-v2.request"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Capture source-run state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build=build/other-versions-stock-first
          gh run view 29527676526 --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,createdAt,startedAt,updatedAt,url,jobs \
            > "$build/stock-v2-live-status.json"
          status="$(python3 -c 'import json; print(json.load(open("build/other-versions-stock-first/stock-v2-live-status.json"))["status"])')"
          conclusion="$(python3 -c 'import json; print(json.load(open("build/other-versions-stock-first/stock-v2-live-status.json")).get("conclusion") or "")')"
          printf 'status=%s\nconclusion=%s\n' "$status" "$conclusion" > "$build/stock-v2-live-summary.txt"
          if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
            gh run view 29527676526 --repo "$GITHUB_REPOSITORY" --log-failed \
              > "$build/stock-v2-failed-log.txt" 2>&1 || true
          fi
          git config user.name diagnostic-bot
          git config user.email diagnostic@users.noreply.github.com
          git add "$build/stock-v2-live-status.json" "$build/stock-v2-live-summary.txt" "$build/stock-v2-failed-log.txt" 2>/dev/null || true
          git commit -m "diagnostic: capture Other Versions stock-v2 run state" || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
