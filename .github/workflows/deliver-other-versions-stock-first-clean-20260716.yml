name: Deliver Other Versions Stock First Clean 20260716

on:
  workflow_run:
    workflows: ["Render video"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first-clean-20260716/delivery.request"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  SLUG: other-versions-stock-first-clean-20260716
  STATUS_URL: https://filebin.net/b2d6f8a04c9e41d3ab7581f62c0e9475/delivery-status.json

concurrency:
  group: deliver-other-versions-stock-first-clean-20260716
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find the standard pipeline run and publish a secure delivery pointer
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import pathlib
          import time
          import urllib.request

          slug = os.environ["SLUG"]
          token = os.environ["GH_TOKEN"]
          event_run_id = os.environ.get("EVENT_RUN_ID", "").strip()
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "other-versions-clean-delivery",
          }
          api = "https://api.github.com/repos/jameswatson1077/tiktok-videos"

          def get_json(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)

          selected = None
          deadline = time.time() + 3900
          while time.time() < deadline and selected is None:
              run_ids = []
              if event_run_id:
                  try:
                      run_ids.append(int(event_run_id))
                  except ValueError:
                      pass
              runs = get_json(f"{api}/actions/workflows/render.yml/runs?event=workflow_dispatch&branch=main&per_page=50").get("workflow_runs") or []
              run_ids.extend(int(run["id"]) for run in runs if int(run["id"]) not in run_ids)

              for run_id in run_ids:
                  run = get_json(f"{api}/actions/runs/{run_id}")
                  artifacts = get_json(f"{api}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts") or []
                  exact = next((a for a in artifacts if a.get("name") == slug), None)
                  governor = next((a for a in artifacts if str(a.get("name") or "").startswith(slug + "-governor-")), None)
                  if exact is not None:
                      selected = {"run": run, "artifact": exact, "kind": "delivery"}
                      break
                  if run.get("status") == "completed" and governor is not None:
                      selected = {"run": run, "artifact": governor, "kind": "governor_failure"}
                      break
              if selected is None:
                  time.sleep(20)

          if selected is None:
              raise SystemExit("No completed standard renderer run for the clean slug was found.")

          run = selected["run"]
          artifact = selected["artifact"]
          artifact_id = int(artifact["id"])
          signed_request = urllib.request.Request(f"{api}/actions/artifacts/{artifact_id}/zip", headers=headers)
          opener = urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
          with opener.open(signed_request, timeout=45) as response:
              signed_url = response.geturl()

          payload = {
              "slug": slug,
              "render_system": "repository TikTok Video Pipeline / render.yml",
              "run_id": int(run["id"]),
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
              "head_sha": run.get("head_sha"),
              "artifact_id": artifact_id,
              "artifact_name": artifact.get("name"),
              "artifact_size_bytes": artifact.get("size_in_bytes"),
              "artifact_kind": selected["kind"],
              "signed_download_url": signed_url,
          }
          output = pathlib.Path("build") / slug / "delivery-status.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("/tmp/delivery-status.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

          curl --fail --silent --show-error --retry 10 --retry-delay 2 \
            -X POST -H 'Content-Type: application/json' \
            --data-binary @/tmp/delivery-status.json "$STATUS_URL"

      - name: Persist delivery status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "build/$SLUG/delivery-status.json" || exit 0
          git config user.name "render-delivery-bot"
          git config user.email "render-delivery@users.noreply.github.com"
          git add "build/$SLUG/delivery-status.json"
          git commit -m "video $SLUG: record standard pipeline delivery"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; }
            git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          exit 1
