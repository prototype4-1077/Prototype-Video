name: Analyze Other Versions Audio Parts

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/analyze-audio-parts.request"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Measure candidate packages and subsets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, itertools, json, pathlib, re
          expected_sha='2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa'
          expected_size=1135634
          roots=[pathlib.Path('build/the-other-versions-of-you'),pathlib.Path('build/other-versions-stock-first')]
          groups={}
          for root in roots:
              if not root.exists(): continue
              for p in root.iterdir():
                  if not p.is_file() or 'part' not in p.name.lower(): continue
                  m=re.match(r'^(.*?part)[._-]?(\d+)(?:[^0-9].*)?$',p.name,re.I)
                  if not m: continue
                  groups.setdefault(str(root/m.group(1)),[]).append((int(m.group(2)),p))
          rows=[]; exact=[]; closest=None
          for prefix,items in sorted(groups.items()):
              items.sort(key=lambda x:(x[0],x[1].name))
              # Remove exact duplicate textual segments while preserving numeric order.
              dedup=[]; seen=set()
              for idx,p in items:
                  text=''.join(p.read_text(encoding='utf-8',errors='ignore').split())
                  key=(idx,text)
                  if key in seen: continue
                  seen.add(key); dedup.append((idx,p,text))
              n=len(dedup)
              # Full package and all order-preserving subsets for groups of manageable size.
              masks=[(1<<n)-1]
              if n <= 14:
                  masks=range(1,1<<n)
              best_group=None
              for mask in masks:
                  compact=''.join(dedup[i][2] for i in range(n) if mask>>i & 1)
                  try: data=base64.b64decode(compact,validate=True)
                  except Exception: continue
                  sha=hashlib.sha256(data).hexdigest()
                  diff=abs(len(data)-expected_size)
                  record={'prefix':prefix,'mask':mask,'parts':[dedup[i][1].name for i in range(n) if mask>>i&1],
                          'chars':len(compact),'bytes':len(data),'sha256':sha,'diff':diff}
                  if best_group is None or (diff, -len(record['parts'])) < (best_group['diff'],-len(best_group['parts'])):
                      best_group=record
                  if closest is None or (diff, -len(record['parts'])) < (closest['diff'],-len(closest['parts'])):
                      closest=record
                  if sha==expected_sha:
                      exact.append(record)
                      pathlib.Path('/tmp/exact-recovered.mp3').write_bytes(data)
                      break
              rows.append({'prefix':prefix,'part_count':n,'best':best_group})
          out={'expected_size':expected_size,'groups':rows,'closest':closest,'exact':exact}
          pathlib.Path('build/other-versions-stock-first/audio-parts-analysis.json').write_text(json.dumps(out,indent=2)+'\n')
          if exact:
              label='EXACT_RECOVERED'
          elif closest:
              raw=closest['prefix'].replace('build/','').replace('/','_')
              safe=re.sub(r'[^A-Za-z0-9]+','_',raw).strip('_')
              label=f'CLOSEST_{safe}_BYTES_{closest["bytes"]}_DIFF_{closest["diff"]}'
          else:
              label='NO_DECODABLE_PACKAGE'
          pathlib.Path('build/other-versions-stock-first/audio-parts-analysis-label.txt').write_text(label+'\n')
          pathlib.Path(f'build/other-versions-stock-first/AUDIO_ANALYSIS_{label}.marker').write_text(label+'\n')
          PY
          label="$(cat build/other-versions-stock-first/audio-parts-analysis-label.txt)"
          git config user.name diagnostic-bot
          git config user.email diagnostic@users.noreply.github.com
          git add build/other-versions-stock-first/audio-parts-analysis.json build/other-versions-stock-first/audio-parts-analysis-label.txt build/other-versions-stock-first/AUDIO_ANALYSIS_*.marker
          git commit -m "diagnostic stock-v2 AUDIO_ANALYSIS_${label}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
