name: Perpetual Frontier integrity

on:
  pull_request:
    paths:
      - "concept/perpetual_frontier.py"
      - "concept/evidence.py"
      - "concept/evolution_constitution.json"
      - "concept/provisional_rules.json"
      - "concept/capability_constitution.json"
      - "concept/expedition_library.json"
      - "concept/PERPETUAL_FRONTIER.md"
      - "concept/tests/test_perpetual_frontier.py"
      - ".github/workflows/perpetual-frontier-*.yml"
  push:
    branches: [main]
    paths:
      - "concept/perpetual_frontier.py"
      - "concept/evidence.py"
      - "concept/evolution_constitution.json"
      - "concept/provisional_rules.json"
      - "concept/capability_constitution.json"
      - "concept/expedition_library.json"
      - "concept/tests/test_perpetual_frontier.py"
      - ".github/workflows/perpetual-frontier-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compile and validate constitutions
        run: |
          python3 -m py_compile concept/perpetual_frontier.py
          python3 - <<'PY'
          import json
          paths = [
              'concept/evolution_constitution.json',
              'concept/provisional_rules.json',
              'concept/capability_constitution.json',
              'concept/expedition_library.json',
          ]
          for path in paths:
              json.load(open(path, encoding='utf-8'))
              print('valid', path)
          PY

      - name: Run evolution-loop tests
        run: python3 -m unittest concept.tests.test_perpetual_frontier -v

      - name: Exercise real repository evidence in observation-only mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          baseline = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('build').glob('*/render.request')}
          Path('/tmp/frontier-render-markers.json').write_text(json.dumps(baseline))
          PY
          python3 concept/perpetual_frontier.py --root . --date 2026-07-23 > /tmp/frontier-brief.txt
          test -s concept/evolution_state/LATEST.json
          test -s concept/evolution_state/BRIEF.md
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          state = json.load(open('concept/evolution_state/LATEST.json', encoding='utf-8'))
          assert state['production_files_modified'] is False
          assert state['requires_human_selection'] is True
          assert state['surprise_portfolio']['allocation']['wild'] > 0
          assert all(dream['fidelity'] == 'metaphor' for dream in state['dreams'])
          assert all(dream['invitation'].endswith('?') for dream in state['dreams'])
          before = json.loads(Path('/tmp/frontier-render-markers.json').read_text())
          after = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('build').glob('*/render.request')}
          assert after == before, 'observation-only cycle created, removed, or modified a render request'
          PY
          find concept -type d -name __pycache__ -prune -exec rm -rf {} +
          changed="$(git status --porcelain | awk '{print $2}' | grep -v '^concept/evolution_state/' || true)"
          test -z "$changed" || { echo "unexpected changed paths:"; echo "$changed"; exit 1; }
