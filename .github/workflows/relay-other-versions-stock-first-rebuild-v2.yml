name: Relay Other Versions Stock First Rebuild V2

on:
  workflow_run:
    workflows: ["Render Other Versions Stock First Rebuild V2"]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  RELAY_URL: https://filebin.net/b8d3e42f9a7146c4a0f58c3e1d7b2a95/delivery.json

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Create temporary authenticated delivery pointer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time, urllib.request

          run_id = int(os.environ["RUN_ID"])
          conclusion = os.environ["CONCLUSION"]
          token = os.environ["GH_TOKEN"]
          payload = {
              "workflow": "Render Other Versions Stock First Rebuild V2",
              "run_id": run_id,
              "conclusion": conclusion,
          }

          if conclusion == "success":
              time.sleep(8)
              request = urllib.request.Request(
                  f"https://api.github.com/repos/jameswatson1077/tiktok-videos/actions/runs/{run_id}/artifacts",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "stock-first-delivery-relay",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  artifacts = json.load(response).get("artifacts") or []
              artifact = next(
                  (item for item in artifacts if item.get("name") == "other-versions-stock-first-rebuild-v2"),
                  artifacts[0] if artifacts else None,
              )
              if artifact is None:
                  raise SystemExit("successful render has no artifact")
              artifact_id = int(artifact["id"])
              download_request = urllib.request.Request(
                  f"https://api.github.com/repos/jameswatson1077/tiktok-videos/actions/artifacts/{artifact_id}/zip",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "stock-first-delivery-relay",
                  },
                  method="GET",
              )
              opener = urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
              with opener.open(download_request, timeout=30) as response:
                  signed_url = response.geturl()
              payload.update({
                  "artifact_id": artifact_id,
                  "artifact_name": artifact.get("name"),
                  "artifact_size_bytes": artifact.get("size_in_bytes"),
                  "signed_download_url": signed_url,
              })
          else:
              result = subprocess.run(
                  ["gh", "run", "view", str(run_id), "--repo", "jameswatson1077/tiktok-videos", "--log-failed"],
                  capture_output=True, text=True,
              )
              text = (result.stdout or "") + "\n" + (result.stderr or "")
              payload["failure_excerpt"] = [
                  line for line in text.splitlines()
                  if "ERROR" in line or "FIX" in line or "failed" in line.lower() or "exact" in line.lower()
              ][-40:]
              payload["failure_log_tail"] = text[-12000:]

          path = pathlib.Path("/tmp/delivery.json")
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            -X POST --data-binary @/tmp/delivery.json "$RELAY_URL"
