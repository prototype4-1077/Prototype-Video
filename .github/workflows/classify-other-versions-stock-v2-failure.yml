name: Classify Other Versions Stock V2 Failure

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/classify-stock-v2-failure.request"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Extract and classify failed log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build=build/other-versions-stock-first
          gh run view 29527676526 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/stock-v2-failed.log 2>&1 || true
          cp /tmp/stock-v2-failed.log "$build/stock-v2-failed-log-full.txt"
          grep -Ei 'ERROR:|FIX:|mismatch|unexpected|failed|no results|no candidate|quality gate|Traceback|AssertionError' /tmp/stock-v2-failed.log | tail -n 80 > "$build/stock-v2-failure-excerpt.txt" || true
          category=UNKNOWN
          grep -Eqi 'sha256|checksum|duration mismatch|size mismatch|base64|invalid input' /tmp/stock-v2-failed.log && category=AUDIO || true
          grep -Eqi 'visual symbol plan|symbol families|human imagery|generic human|repeats for' /tmp/stock-v2-failed.log && category=VISUAL_SYMBOL || true
          grep -Eqi 'no results|no candidate contains enough temporal motion|no stock|stock acquisition' /tmp/stock-v2-failed.log && category=STOCK_SEARCH || true
          grep -Eqi 'stock-only quality gate failed|not verified genuine stock|still_source_ratio|true_motion_ratio' /tmp/stock-v2-failed.log && category=STOCK_ONLY_GATE || true
          grep -Eqi 'missing requested output|missing required delivery|No such file|not found' /tmp/stock-v2-failed.log && category=MISSING_OUTPUT || true
          scene="$(grep -Eio 'scene[ :]+[0-9]+' /tmp/stock-v2-failed.log | tail -n 1 | grep -Eo '[0-9]+' || true)"
          [ -n "$scene" ] || scene=NA
          rm -f "$build"/FAILURE_*.marker
          printf 'run_id=29527676526\ncategory=%s\nscene=%s\n' "$category" "$scene" > "$build/FAILURE_${category}_SCENE_${scene}.marker"
          git config user.name diagnostic-bot
          git config user.email diagnostic@users.noreply.github.com
          git add "$build/stock-v2-failed-log-full.txt" "$build/stock-v2-failure-excerpt.txt" "$build"/FAILURE_*.marker
          git commit -m "diagnostic stock-v2 FAILURE_${category} SCENE_${scene}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
