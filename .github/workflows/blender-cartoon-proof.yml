name: Blender Cartoon Proof

# Manual-only production-path proof. Provisions pinned Blender and Rhubarb
# binaries, generates temporary dialogue audio, and uploads landscape + portrait
# June Porch videos. Generated media remains an artifact and never enters Git.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch or sha that carries the Blender backend"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER_VERSION: "4.2.0"
      BLENDER_SERIES: "Blender4.2"
      RHUBARB_VERSION: "1.13.0"
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Install headless render and proof-audio dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxrandr2 \
            libxinerama1 libxcursor1 libxkbcommon0 libsm6 libgl1 libegl1 \
            libglu1-mesa libwayland-client0 libwayland-egl1 libdbus-1-3 \
            espeak-ng ffmpeg unzip xz-utils

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender (cache miss only)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "Downloading $url"
          curl -fL --retry 3 -o /tmp/blender.tar.xz "$url"
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1

      - name: Verify Blender launches headless
        run: /opt/blender/blender --background --version

      - name: Cache Rhubarb Lip Sync
        id: cache-rhubarb
        uses: actions/cache@v4
        with:
          path: /opt/rhubarb
          key: rhubarb-${{ env.RHUBARB_VERSION }}-linux-x64

      - name: Download Rhubarb Lip Sync (cache miss only)
        if: steps.cache-rhubarb.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v${RHUBARB_VERSION}/Rhubarb-Lip-Sync-${RHUBARB_VERSION}-Linux.zip"
          curl -fL --retry 3 -o /tmp/rhubarb.zip "$url"
          rm -rf /tmp/rhubarb-release
          mkdir -p /tmp/rhubarb-release
          unzip -q /tmp/rhubarb.zip -d /tmp/rhubarb-release
          source_bin="$(find /tmp/rhubarb-release -type f -name rhubarb -print -quit)"
          test -n "$source_bin"
          sudo mkdir -p /opt/rhubarb
          sudo cp -R "$(dirname "$source_bin")"/. /opt/rhubarb/
          sudo chmod +x /opt/rhubarb/rhubarb

      - name: Verify Rhubarb launches
        run: /opt/rhubarb/rhubarb --version

      - name: Cartoon contract tests
        run: |
          python3 -m unittest discover \
            -s pipeline/tests \
            -p 'test_cartoon_*.py' \
            -q

      - name: Generate temporary proof dialogue
        run: |
          mkdir -p proof-input
          python3 -c "import json, pathlib; data=json.load(open('examples/june-porch-vertical-slice.json', encoding='utf-8')); pathlib.Path('proof-input/dialogue.txt').write_text(data['dialogue']['text'] + '\n', encoding='utf-8')"
          espeak-ng -s 112 -v en-us -f proof-input/dialogue.txt -w proof-input/june-dialogue.wav

      - name: Render June Porch landscape and portrait proofs
        env:
          BLENDER_BIN: /opt/blender/blender
        run: |
          set -euo pipefail
          python3 -m pipeline.cartoon_vertical_slice \
            examples/june-porch-vertical-slice.json \
            --audio proof-input/june-dialogue.wav \
            --rhubarb /opt/rhubarb/rhubarb \
            --blender /opt/blender/blender \
            --ffmpeg ffmpeg \
            --profiles youtube portrait \
            --quality proof \
            --output-dir proof-out
          find proof-out -maxdepth 2 -type f -print

      - name: Upload animated proof products immediately
        uses: actions/upload-artifact@v4
        with:
          name: blender-cartoon-proof-videos
          path: |
            proof-out/*.mp4
            proof-out/*.png
            proof-out/*.json
            proof-out/plans/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Build asset library and render continuous geometry gates
        run: |
          set -euo pipefail
          python3 -m pipeline.cartoon_asset_library \
            examples/june-porch-vertical-slice.json \
            concept/characters/june_oxley_asset_v4.json \
            --blender /opt/blender/blender \
            --ffmpeg ffmpeg \
            --engine BLENDER_WORKBENCH \
            --samples 1 \
            --facial-engine BLENDER_WORKBENCH \
            --facial-size 480 \
            --facial-samples 1 \
            --output-dir asset-quality-out
          find asset-quality-out -maxdepth 3 -type f -print

      - name: Upload asset, geometry sheets, and facial matrix
        uses: actions/upload-artifact@v4
        with:
          name: blender-cartoon-asset-review-v4
          path: |
            asset-quality-out/*.png
            asset-quality-out/*.json
            asset-quality-out/plans/*.json
            asset-quality-out/assets/*.blend
            asset-quality-out/frames/**/*.png
          if-no-files-found: error
          retention-days: 14

