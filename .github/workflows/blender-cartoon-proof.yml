name: Blender 3D Graphics Proof

# Manual-only. Provisions the same headless Blender used by render.yml and
# renders one production motion-graphic scene as a reviewable PNG.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or sha carrying the Blender backend"
        required: false
        default: "main"
      slug:
        description: "Build slug containing script.json"
        required: false
        default: "you-see-what-matters"
      scene:
        description: "Zero-based scene index, or all for one proof per graphic family"
        required: false
        default: "all"
      output:
        description: "Render preview PNGs or a complete animated MP4 clip"
        required: false
        type: choice
        options:
          - preview
          - clip
        default: preview

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLENDER_VERSION: "4.2.0"
      BLENDER_SERIES: "Blender4.2"
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Install headless runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxrandr2 \
            libxinerama1 libxcursor1 libxkbcommon0 libsm6 libgl1 libegl1 \
            libglu1-mesa libwayland-client0 libwayland-egl1 libdbus-1-3 xz-utils

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender (cache miss only)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "Downloading $url"
          curl -fL --retry 3 -o /tmp/blender.tar.xz "$url"
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1

      - name: Verify Blender launches headless
        run: /opt/blender/blender --background --version

      - name: 3D graphic contract tests
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "pipeline")
          import blender_graphics
          assert len(blender_graphics.GRAPHIC_KINDS) == 9
          print("3D plan contract available for all nine graphic families")
          PY

      - name: Render production 3D proof
        env:
          BLENDER_BIN: /opt/blender/blender
        run: |
          set -euo pipefail
          selection="${{ github.event.inputs.scene }}"
          if [[ "$selection" == "all" ]]; then
            mapfile -t scenes < <(python3 - <<'PY'
          import json
          from pathlib import Path

          script = json.loads(Path("build/${{ github.event.inputs.slug }}/script.json").read_text(encoding="utf-8"))
          seen = set()
          for index, scene in enumerate(script.get("scenes") or []):
              kind = scene.get("graphic_kind")
              if kind and kind not in seen:
                  seen.add(kind)
                  print(index)
          PY
          )
          else
            scenes=("$selection")
          fi
          mode=(--preview)
          if [[ "${{ github.event.inputs.output }}" == "clip" ]]; then
            mode=()
          fi
          for scene in "${scenes[@]}"; do
            python3 pipeline/blender_graphics.py \
              "build/${{ github.event.inputs.slug }}" \
              --scene "$scene" "${mode[@]}" --output-dir proof-out
          done
          ls -la proof-out

      - name: Upload proof frame
        uses: actions/upload-artifact@v4
        with:
          name: blender-3d-graphics-proof
          path: |
            proof-out/*.png
            proof-out/*.mp4
          if-no-files-found: error



