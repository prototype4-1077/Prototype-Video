name: Render Other Versions Stock First V2

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/stock-only-render-v2.request"
  workflow_dispatch:

permissions:
  contents: write

env:
  SLUG: other-versions-stock-first
  EXPECTED_AUDIO_SHA256: 2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa
  EXPECTED_AUDIO_SIZE: "1135634"
  EXPECTED_AUDIO_DURATION: "68.754250"

concurrency:
  group: render-other-versions-stock-first-v2
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record run identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > "build/$SLUG/stock-v2-run-id.txt"
          cat > "build/$SLUG/stock-v2-status.json" <<JSON
          {"run_id":"$GITHUB_RUN_ID","state":"started","slug":"$SLUG"}
          JSON
          git config user.name "stock-render-bot"
          git config user.email "stock-render@users.noreply.github.com"
          git add "build/$SLUG/stock-v2-run-id.txt" "build/$SLUG/stock-v2-status.json"
          git commit -m "render $SLUG stock-v2: started $GITHUB_RUN_ID" || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache semantic models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/clipcache
            /tmp/models
          key: models-v1

      - name: System dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Restore and verify exact attached MP3
        shell: bash
        run: |
          set -euo pipefail
          build="build/$SLUG"
          shopt -s nullglob
          parts=("$build"/vo.mp3.b64.part*)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > "$build/vo.mp3"
          sha="$(sha256sum "$build/vo.mp3" | awk '{print $1}')"
          size="$(stat -c '%s' "$build/vo.mp3")"
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$build/vo.mp3")"
          format="$(ffprobe -v error -show_entries format=format_name -of default=noprint_wrappers=1:nokey=1 "$build/vo.mp3")"
          test "$sha" = "$EXPECTED_AUDIO_SHA256"
          test "$size" = "$EXPECTED_AUDIO_SIZE"
          python3 - "$duration" "$EXPECTED_AUDIO_DURATION" <<'PY'
          import sys
          actual, expected = map(float, sys.argv[1:])
          if abs(actual - expected) > 0.001:
              raise SystemExit(f"duration mismatch: {actual:.6f} != {expected:.6f}")
          PY
          case "$format" in *mp3*) ;; *) echo "not MP3: $format" >&2; exit 1;; esac
          python3 - "$build/audio-verification.json" "$sha" "$size" "$duration" "$format" <<'PY'
          import json, pathlib, sys
          out, sha, size, duration, fmt = sys.argv[1:]
          pathlib.Path(out).write_text(json.dumps({
            "source_attachment": "ElevenLabs_2026-07-16T14_35_48_Liam - Energetic, Social Media Creator_pre_sp100_s50_sb75_v3 (1)(1).mp3",
            "sha256": sha,
            "size_bytes": int(size),
            "duration_seconds": float(duration),
            "format": fmt,
            "exact_bytes_restored": True,
            "transcoded_before_pipeline": False,
            "pipeline_voiceover_path": "vo.mp3"
          }, indent=2) + "\n", encoding="utf-8")
          PY
          echo "Exact attached MP3 verified: $duration seconds, $size bytes, $sha"

      - name: Python dependencies
        run: pip install -q -r pipeline/requirements.txt

      - name: Pipeline regression tests
        run: python3 -m unittest discover -s pipeline/tests -v

      - name: Reset build to fresh stock-only policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          build = pathlib.Path("build/other-versions-stock-first")
          path = build / "script.json"
          script = json.loads(path.read_text(encoding="utf-8"))
          script["user_vo"] = True
          script["render_outputs"] = ["portrait"]
          script["music_choice"] = 3
          script["max_still_source_ratio"] = 0.0
          for scene in script.get("scenes", []):
              for key in (
                  "clip", "stock_id", "pexels_id", "source_id", "source_url",
                  "source_title", "source_license", "stock_frame_url",
                  "stock_frame_url_checked", "stock_frame_url_unusable",
                  "motion_kind", "motion_mode", "motion_source", "motion_verified",
                  "motion_evidence", "hero", "image_prompt", "source_image",
                  "keyframes", "symbolic_kind", "portrait_symbolic_render_version",
                  "still_reference_scene", "still_reference_path"
              ):
                  scene.pop(key, None)
          path.write_text(json.dumps(script, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          for pattern in ("clip_*.mp4", "seg_*.mp4", "final*.mp4", "still_*", "hero_*", "enhanced_still_*", "stock_reference_*.jpg"):
              for item in build.glob(pattern):
                  item.unlink(missing_ok=True)
          PY

      - name: API keys
        shell: bash
        run: |
          printf 'ELEVENLABS_API_KEY=%s\nPEXELS_API_KEY=%s\nELEVENLABS_VOICE_ID=%s\n' \
            "${{ secrets.ELEVENLABS_API_KEY }}" "${{ secrets.PEXELS_API_KEY }}" \
            "${{ secrets.ELEVENLABS_VOICE_ID || 'TX3LPaxmHKxFdv7VOQHJ' }}" > pipeline/.env

      - name: Render through TikTok Video Pipeline
        env:
          SEMANTIC_CLIP: "1"
          GOVERNOR_MODE: "recover"
          GOVERNOR_CONSOLE_HEARTBEATS: "1"
          GOVERNOR_HEARTBEAT_SECONDS: "15"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          test -s "build/$SLUG/vo.mp3"
          test "$(sha256sum "build/$SLUG/vo.mp3" | awk '{print $1}')" = "$EXPECTED_AUDIO_SHA256"
          python3 pipeline/run_governed.py "build/$SLUG" --max-passes 200 --overall-timeout 4680

      - name: Enforce genuine-stock-only quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          build = pathlib.Path("build/other-versions-stock-first")
          script = json.loads((build / "script.json").read_text(encoding="utf-8"))
          motion = json.loads((build / "motion_report.json").read_text(encoding="utf-8"))
          errors = []
          bad_tokens = ("deterministic", "symbolic", "generated", "pollinations", "hero", "still", "image_to_video", "i2v")
          rows = []
          for index, scene in enumerate(script.get("scenes", [])):
              source = str(scene.get("motion_source") or "").lower()
              stock_id = scene.get("stock_id") or scene.get("pexels_id")
              kind = str(scene.get("motion_kind") or "").lower()
              mode = str(scene.get("motion_mode") or "").lower()
              prohibited_fields = [k for k in ("hero", "image_prompt", "source_image", "keyframes", "symbolic_kind") if scene.get(k)]
              passed = bool(stock_id) and kind == "video" and mode == "stock" and not any(t in source for t in bad_tokens) and not prohibited_fields
              row = {
                "scene": index,
                "stock_id": stock_id,
                "motion_source": source,
                "motion_kind": kind,
                "motion_mode": mode,
                "prohibited_fields": prohibited_fields,
                "passed": passed
              }
              rows.append(row)
              if not passed:
                  errors.append(f"scene {index} is not verified genuine stock: {row}")
          still_ratio = float(motion.get("still_source_ratio", 1.0))
          true_motion = float(motion.get("true_motion_ratio", 0.0))
          if abs(still_ratio) > 1e-9:
              errors.append(f"still_source_ratio must be 0.0, got {still_ratio}")
          if true_motion < 0.999:
              errors.append(f"true_motion_ratio must be 1.0, got {true_motion}")
          required = ["final.mp4", "scene-review.html", "scene-review.json", "visual_symbol_report.json", "music_variants.json", "CREDITS.txt"]
          for name in required:
              if not (build / name).is_file() or (build / name).stat().st_size == 0:
                  errors.append(f"missing required delivery file: {name}")
          probe = subprocess.run([
              "ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=width,height", "-of", "csv=p=0:s=x",
              str(build / "final.mp4")
          ], capture_output=True, text=True)
          dimensions = probe.stdout.strip()
          if dimensions != "1080x1920":
              errors.append(f"portrait dimensions must be 1080x1920, got {dimensions}")
          report = {
            "schema_version": 1,
            "slug": script.get("slug"),
            "policy": "genuine stock only; zero graphics and zero still-derived footage",
            "passed": not errors,
            "dimensions": dimensions,
            "still_source_ratio": still_ratio,
            "true_motion_ratio": true_motion,
            "errors": errors,
            "scenes": rows
          }
          (build / "stock-only-verification.json").write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, ensure_ascii=False))
          if errors:
              raise SystemExit("stock-only quality gate failed")
          PY
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "build/$SLUG/final.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 "build/$SLUG/final.mp4"

      - name: Mark successful delivery
        shell: bash
        run: |
          set -euo pipefail
          cat > "build/$SLUG/stock-v2-status.json" <<JSON
          {"run_id":"$GITHUB_RUN_ID","state":"success","slug":"$SLUG","artifact":"$SLUG-stock-v2"}
          JSON

      - name: Upload stock-only delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}-stock-v2
          retention-days: 30
          path: |
            build/${{ env.SLUG }}/final.mp4
            build/${{ env.SLUG }}/scene-review.html
            build/${{ env.SLUG }}/scene-review.json
            build/${{ env.SLUG }}/music_variants.json
            build/${{ env.SLUG }}/motion_report.json
            build/${{ env.SLUG }}/visual_symbol_report.json
            build/${{ env.SLUG }}/still_reference_report.json
            build/${{ env.SLUG }}/quality_report.json
            build/${{ env.SLUG }}/stock-only-verification.json
            build/${{ env.SLUG }}/audio-verification.json
            build/${{ env.SLUG }}/alts_sheet.jpg
            build/${{ env.SLUG }}/CREDITS.txt

      - name: Publish permanent stock-only release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="video-$SLUG-stock-v2"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Other Versions of You — Stock First" --notes "Fresh TikTok Video Pipeline render using the exact attached MP3 and genuine stock footage only. Run $GITHUB_RUN_ID."
          gh release upload "$tag" "build/$SLUG/final.mp4#Other_Versions_of_You_Stock_First_TikTok.mp4" --clobber
          for file in scene-review.html scene-review.json music_variants.json motion_report.json visual_symbol_report.json still_reference_report.json quality_report.json stock-only-verification.json audio-verification.json alts_sheet.jpg CREDITS.txt; do
            test -f "build/$SLUG/$file" && gh release upload "$tag" "build/$SLUG/$file" --clobber || true
          done

      - name: Persist reports and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f pipeline/.env "build/$SLUG/vo.mp3"
          if [ ! -f "build/$SLUG/stock-v2-status.json" ]; then
            cat > "build/$SLUG/stock-v2-status.json" <<JSON
            {"run_id":"$GITHUB_RUN_ID","state":"failure","slug":"$SLUG"}
            JSON
          fi
          git config user.name "stock-render-bot"
          git config user.email "stock-render@users.noreply.github.com"
          for file in script.json stock-v2-run-id.txt stock-v2-status.json audio-verification.json stock-only-verification.json motion_report.json visual_symbol_report.json quality_report.json scene-review.json alts.json governor-summary.json governor-review.json render-status.json; do
            git add "build/$SLUG/$file" 2>/dev/null || true
          done
          git add pipeline/memory.json pipeline/visual_symbols.py 2>/dev/null || true
          git commit -m "render $SLUG stock-v2: persist outcome $GITHUB_RUN_ID" || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git stash --include-untracked || true
            git pull --rebase origin main || git rebase --abort || true
            git stash pop || true
            sleep $((i * 2))
          done
          exit 1
