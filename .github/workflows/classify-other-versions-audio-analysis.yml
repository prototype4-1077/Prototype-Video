name: Classify Other Versions Audio Analysis

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/classify-audio-analysis.request"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish compact closest-package classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          p=pathlib.Path('build/other-versions-stock-first/audio-parts-analysis.json')
          data=json.loads(p.read_text())
          c=data.get('closest') or {}
          prefix=c.get('prefix','')
          if 'other-versions-stock-first' in prefix: group='FRESH'
          elif 'vo.mp3.exact' in prefix: group='OLD_EXACT'
          elif 'vo.mp3' in prefix: group='OLD_MP3'
          elif 'opus' in prefix: group='OLD_OPUS'
          else: group='OTHER'
          diff=int(c.get('diff',999999999)); size=int(c.get('bytes',0)); chars=int(c.get('chars',0)); parts=len(c.get('parts',[]))
          if diff==0: band='ZERO'
          elif diff<100: band='LT100'
          elif diff<1000: band='LT1K'
          elif diff<10000: band='LT10K'
          elif diff<100000: band='LT100K'
          elif diff<500000: band='LT500K'
          else: band='GE500K'
          sign='SHORT' if size<1135634 else ('LONG' if size>1135634 else 'SAME_SIZE')
          label=f'{group}_{band}_{sign}_PARTS_{parts}_BYTES_{size}_DIFF_{diff}_CHARS_{chars}'
          root=pathlib.Path('build/other-versions-stock-first')
          for old in root.glob('AUDIO_CLOSEST_*.marker'): old.unlink()
          (root/f'AUDIO_CLOSEST_{label}.marker').write_text(label+'\n')
          (root/'audio-closest-label.txt').write_text(label+'\n')
          PY
          label="$(cat build/other-versions-stock-first/audio-closest-label.txt)"
          git config user.name diagnostic-bot
          git config user.email diagnostic@users.noreply.github.com
          git add -A build/other-versions-stock-first/AUDIO_CLOSEST_*.marker build/other-versions-stock-first/audio-closest-label.txt
          git commit -m "diagnostic stock-v2 AUDIO_CLOSEST_${label}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
