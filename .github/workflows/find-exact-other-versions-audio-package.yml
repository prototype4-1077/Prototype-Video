name: Find Exact Other Versions Audio Package

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/find-exact-audio.request"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Test every known narration package
        shell: bash
        run: |
          set -euo pipefail
          expected=2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa
          out=build/other-versions-stock-first/exact-audio-package-report.txt
          : > "$out"
          winner=NONE
          test_package() {
            label="$1"; pattern="$2"
            shopt -s nullglob
            parts=( $pattern )
            echo "[$label] parts=${#parts[@]}" >> "$out"
            if ((${#parts[@]}==0)); then return; fi
            cat "${parts[@]}" | tr -d '\r\n' > "/tmp/$label.b64"
            if ! base64 --decode "/tmp/$label.b64" > "/tmp/$label.mp3" 2>>"$out"; then
              echo "[$label] decode=failed" >> "$out"
              return
            fi
            sha="$(sha256sum "/tmp/$label.mp3" | awk '{print $1}')"
            size="$(stat -c '%s' "/tmp/$label.mp3")"
            dur="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "/tmp/$label.mp3" 2>/dev/null || true)"
            echo "[$label] sha=$sha size=$size duration=$dur" >> "$out"
            if [ "$sha" = "$expected" ]; then
              winner="$label"
              cp "/tmp/$label.mp3" /tmp/exact-winner.mp3
            fi
          }
          test_package FRESH 'build/other-versions-stock-first/vo.mp3.b64.part*'
          test_package OLD_EXACT 'build/the-other-versions-of-you/vo.mp3.exact.b64.part*'
          test_package OLD_MP3 'build/the-other-versions-of-you/vo.mp3.b64.part*'
          test_package OLD_CLEAN 'build/the-other-versions-of-you/clean-vo.mp3.b64.part*'
          echo "winner=$winner" >> "$out"
          rm -f build/other-versions-stock-first/AUDIO_PACKAGE_*.marker
          printf 'winner=%s\n' "$winner" > "build/other-versions-stock-first/AUDIO_PACKAGE_${winner}.marker"
          git config user.name diagnostic-bot
          git config user.email diagnostic@users.noreply.github.com
          git add "$out" build/other-versions-stock-first/AUDIO_PACKAGE_*.marker
          git commit -m "diagnostic stock-v2 AUDIO_PACKAGE_${winner}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
