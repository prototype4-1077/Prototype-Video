name: Learn Can You Fly rejection

on:
  push:
    paths:
      - "build/the-belief-filter/rejection.trigger"

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy
      - name: Record rejected footage and direction
        run: |
          python3 pipeline/learn.py swap build/the-belief-filter 1
          python3 pipeline/learn.py swap build/the-belief-filter 2
          python3 pipeline/learn.py swap build/the-belief-filter 3
          python3 pipeline/learn.py swap build/the-belief-filter 4
          python3 pipeline/learn.py swap build/the-belief-filter 5
          python3 pipeline/learn.py swap build/the-belief-filter 7
          python3 pipeline/learn.py swap build/the-belief-filter 8
          python3 pipeline/learn.py swap build/the-belief-filter 9
          python3 pipeline/learn.py swap build/the-belief-filter 10
          python3 pipeline/learn.py swap build/the-belief-filter 11
          python3 pipeline/learn.py swap build/the-belief-filter 12
          python3 pipeline/learn.py swap build/the-belief-filter 13
          python3 pipeline/learn.py swap build/the-belief-filter 14
          python3 pipeline/learn.py swap build/the-belief-filter 15
          python3 pipeline/learn.py swap build/the-belief-filter 16
          python3 pipeline/learn.py swap build/the-belief-filter 17
          python3 pipeline/learn.py swap build/the-belief-filter 18
          python3 pipeline/learn.py swap build/the-belief-filter 19
          python3 pipeline/learn.py swap build/the-belief-filter 20
          python3 pipeline/learn.py swap build/the-belief-filter 21
          python3 pipeline/learn.py swap build/the-belief-filter 27
          python3 pipeline/learn.py swap build/the-belief-filter 33
          python3 pipeline/learn.py swap build/the-belief-filter 35
          python3 pipeline/learn.py swap build/the-belief-filter 36
          python3 pipeline/learn.py note "Rejected The Belief Filter and renamed it Can You Fly?. Preserve approved scenes 1, 7, 23-27, 29-33, and 35. Revision grammar: 2 moving exclamation mark; 3 rooftop person with arms out; 4 moving question mark; 5 directional street sign and never guns; 6 two people staring; 8 one of those belief-scene people alone in an empty room; 9 choose a different person; 10 person shaking head no; 11 and 19 brain schematics; 12 hang glider; 15 protected-house security sign; 16 police officer badge; 17 matching puzzle with a door; 18 flashing red emergency beacon; 20 glasses or magnifier; 21 access denied; 28 crossed or circled question mark; 34 actual living-room furniture; 36 courtroom witness testifying; 37 person putting on glasses. Match literal mechanism first, then metaphor. Use enhanced stock-frame-conditioned stills when exact footage is unavailable."
          printf '%s\n' "${{ github.run_id }}" > build/the-belief-filter/rejection-recorded.txt
          git config user.name "render-bot"
          git config user.email "render@users.noreply.github.com"
          git add pipeline/memory.json pipeline/taste.npz build/the-belief-filter/script.json build/the-belief-filter/rejection-recorded.txt
          git commit -m "learn: record Can You Fly visual rejection"
          git push
