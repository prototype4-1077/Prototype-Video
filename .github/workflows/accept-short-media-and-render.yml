name: Accept short media and render

on:
  workflow_call:
    inputs:
      slug:
        type: string
        required: true

permissions:
  contents: write
  actions: write

jobs:
  configure_and_dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Permanently allow short supplied media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          render = Path('.github/workflows/render.yml')
          text = render.read_text(encoding='utf-8')
          legacy_guard = 'complete = duration >= 60.0 and size_bytes >= 1_000_000'
          short_guard = 'complete = duration >= 0.5 and size_bytes >= 1_024'
          if legacy_guard in text:
              text = text.replace(legacy_guard, short_guard, 1)
          elif short_guard not in text:
              raise SystemExit('render.yml: expected supplied-media validation guard was not found')
          render.write_text(text, encoding='utf-8')

          existing = Path('.github/workflows/render-existing.yml')
          text = existing.read_text(encoding='utf-8')
          legacy_existing = 'if duration < 60.0 or size < 1_000_000:'
          short_existing = 'if duration < 0.5 or size < 1_024:'
          if legacy_existing in text:
              text = text.replace(legacy_existing, short_existing, 1)
          elif short_existing not in text:
              raise SystemExit('render-existing.yml: expected supplied-media validation guard was not found')
          existing.write_text(text, encoding='utf-8')

          print('Short supplied audio/video enabled at 0.5 seconds / 1024 bytes.')
          PY

      - name: Commit the permanent pipeline change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "render-request-bot"
          git config user.email "render-request@users.noreply.github.com"
          git add .github/workflows/render.yml .github/workflows/render-existing.yml
          git commit -m "pipeline: accept short supplied audio and video" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; }
            git push origin HEAD:main && exit 0
            sleep $((i * 2))
          done
          echo "unable to publish short-media pipeline change" >&2
          exit 1

      - name: Dispatch the requested render on the updated pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          slug="${{ inputs.slug }}"
          gh workflow run render.yml --repo "$GITHUB_REPOSITORY" --ref main -f slug="$slug"
          echo "dispatched render.yml for $slug"
