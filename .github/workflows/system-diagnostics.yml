name: Full system diagnostic

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Render video", "Audience analytics sync", "Refresh YouTube audience statistics", "External signal radar"]
    types: [completed]
  schedule:
    - cron: "41 12 * * 1"
  push:
    branches: [main]
    paths:
      - "pipeline/system_diagnostic_policy.py"
      - ".github/workflows/system-diagnostics.yml"
      - "pipeline/analytics_status.json"
      - "pipeline/operational_memory/index.json"
      - "pipeline/operational_memory/action_queue.json"
      - "concept/visual_memory/action_report.json"
      - "pipeline/memory.json"
      - "pipeline/feedback_rule_candidates.json"
      - "pipeline/stock_supply_report.json"
      - "pipeline/youtube_stats_status.json"
      - "pipeline/*_publish_queue.json"
      - "pipeline/*_published_result.json"
      - "pipeline/whisperx-benchmark-ledger.json"
      - "concept/evolution_state/LATEST.json"
      - "build/*/governor-summary.json"
      - "build/*/telemetry-summary.json"
      - "build/*/quality_report.json"
      - "build/*/narrative_fidelity_report.json"
      - "build/*/yt_stats.json"

permissions:
  contents: write

concurrency:
  group: full-system-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compile diagnostic modules
        run: |
          python3 -m py_compile \
            pipeline/system_diagnostics.py \
            pipeline/system_diagnostic_policy.py \
            pipeline/backfill_observability.py \
            pipeline/feedback_rule_candidates.py \
            pipeline/stock_supply_analysis.py \
            pipeline/yt_stats_refresh.py \
            pipeline/operational_memory_analysis.py \
            pipeline/record_operational_run.py \
            pipeline/package_integrity.py \
            intelligence_stack/fiftyone/analyze_visual_memory.py

      - name: Backfill honest historical telemetry summaries
        run: python3 pipeline/backfill_observability.py

      - name: Materialize provisional feedback candidates
        run: python3 pipeline/feedback_rule_candidates.py

      - name: Measure stock candidate supply
        run: python3 pipeline/stock_supply_analysis.py

      - name: Probe narration provider without generating audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 pipeline/provider_health.py

      - name: Refresh intelligence from current evidence
        run: python3 concept/intelligence.py --json-out concept/INTELLIGENCE_REPORT.json --markdown-out concept/INTELLIGENCE_REPORT.md

      - name: Build calibrated diagnostic and action report
        run: python3 pipeline/system_diagnostic_policy.py

      - name: Validate report contract
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('pipeline/system_diagnostics/LATEST.json', encoding='utf-8'))
          feedback = json.load(open('pipeline/feedback_rule_candidates.json', encoding='utf-8'))
          stock = json.load(open('pipeline/stock_supply_report.json', encoding='utf-8'))
          assert report['authority_boundary']
          assert report['denominator_policy']
          assert 'findings' in report
          assert 'coverage' in report
          assert 'publishing' in report
          assert feedback['authority_boundary']
          assert stock['measurement_boundary']
          coverage = report['coverage']
          assert coverage['render_observed_count'] >= coverage['telemetry_count']
          assert coverage['reviewable_count'] >= coverage['human_feedback_count']
          assert coverage['youtube_published_receipt_count'] >= coverage['youtube_stats_count']
          priorities = report['summary']['priorities']
          print('diagnostic findings', report['summary']['finding_count'], priorities)
          print(
              'calibrated coverage',
              coverage['telemetry_coverage_of_render_observed'],
              coverage['human_feedback_coverage_of_reviewable'],
              coverage['youtube_stats_coverage_of_published'],
          )
          print('feedback candidates', feedback['candidate_count'])
          print('stock supply', stock['state'], stock['evidence_strength'])
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-diagnostic-${{ github.run_id }}
          retention-days: 90
          path: |
            concept/INTELLIGENCE_REPORT.json
            concept/INTELLIGENCE_REPORT.md
            pipeline/analytics_status.json
            pipeline/provider_health.json
            pipeline/system_diagnostics/**
            pipeline/feedback_rule_candidates.json
            pipeline/stock_supply_report.json
            pipeline/youtube_stats_status.json
            build/*/telemetry-summary.json

      - name: Commit diagnostic report and analyzed evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "system-diagnostic-bot"
          git config user.email "system-diagnostic@users.noreply.github.com"
          git add \
            pipeline/provider_health.json \
            concept/INTELLIGENCE_REPORT.json concept/INTELLIGENCE_REPORT.md \
            pipeline/system_diagnostics/LATEST.json \
            pipeline/system_diagnostics/LATEST.md \
            pipeline/feedback_rule_candidates.json \
            pipeline/stock_supply_report.json \
            build/*/telemetry-summary.json
          git commit -m "diagnostic: refresh calibrated evidence and actions" || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || { git rebase --abort || true; }
            python3 pipeline/backfill_observability.py
            python3 pipeline/feedback_rule_candidates.py
            python3 pipeline/stock_supply_analysis.py
            python3 pipeline/system_diagnostic_policy.py
            git add \
              pipeline/provider_health.json \
              concept/INTELLIGENCE_REPORT.json concept/INTELLIGENCE_REPORT.md \
              pipeline/system_diagnostics/LATEST.json \
              pipeline/system_diagnostics/LATEST.md \
              pipeline/feedback_rule_candidates.json \
              pipeline/stock_supply_report.json \
              build/*/telemetry-summary.json
            git commit -m "diagnostic: refresh calibrated evidence and actions" || true
            sleep $((i * 2))
          done
          echo "unable to persist system diagnostic" >&2
          exit 1
