name: Diagnose Can You Fly V3 render

on:
  push:
    paths:
      - "build/can-you-fly-v3/status.trigger"

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture render status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow render-can-you-fly-v3.yml --limit 5 --json databaseId,status,conclusion,createdAt,headSha,url > build/can-you-fly-v3/status.json
          git config user.name "render-bot"
          git config user.email "render@users.noreply.github.com"
          git add build/can-you-fly-v3/status.json
          git commit -m "render: capture Can You Fly V3 status"
          git push
