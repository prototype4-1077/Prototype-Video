name: Render Pattern Wearing Matter Portrait

on:
  push:
    branches: [main]
    paths:
      - "build/pattern-wearing-matter-v2/portrait.request"

permissions:
  contents: write

concurrency:
  group: render-pattern-wearing-matter-v2-portrait
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Mark portrait render started
        shell: bash
        run: |
          mkdir -p build/pattern-wearing-matter-v2
          printf '%s\n' "${{ github.run_id }}" > build/pattern-wearing-matter-v2/portrait-run-id.txt
          git config user.name render-bot
          git config user.email render@users.noreply.github.com
          git add build/pattern-wearing-matter-v2/portrait-run-id.txt
          git commit -m "render pattern-wearing-matter portrait: started ${{ github.run_id }}" || true
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || true
            sleep $((i * 2))
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/clipcache
            /tmp/models
          key: models-v1

      - name: System dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Python dependencies
        run: pip install -q -r pipeline/requirements.txt

      - name: Create exact-timed portrait build and mastering proxy
        shell: bash
        run: |
          rm -rf build/pattern-wearing-matter-v2/clip_*.mp4 \
                 build/pattern-wearing-matter-v2/seg_*.mp4 \
                 build/pattern-wearing-matter-v2/youtube_seg_*.mp4 \
                 build/pattern-wearing-matter-v2/final*.mp4 \
                 build/pattern-wearing-matter-v2/music*.wav \
                 build/pattern-wearing-matter-v2/cap_*.png \
                 build/pattern-wearing-matter-v2/youtube_cap_*.png \
                 build/pattern-wearing-matter-v2/title.png \
                 build/pattern-wearing-matter-v2/youtube_title.png || true
          python3 pipeline/pattern_wearing_matter_v2.py build/pattern-wearing-matter-v2
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i anullsrc=r=44100:cl=mono \
            -t 185.730563 -c:a libmp3lame -b:a 128k \
            build/pattern-wearing-matter-v2/vo.mp3
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/pattern-wearing-matter-v2/script.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          s['voiceover']='vo.mp3'
          s['audio_proxy_only']=True
          s['portrait_native_sources']=True
          p.write_text(json.dumps(s,indent=1,ensure_ascii=False),encoding='utf-8')
          PY

      - name: Generate portrait-safe story-locked footage
        shell: bash
        run: |
          for i in $(seq 0 19); do
            python3 pipeline/symbolic_scene_portrait.py build/pattern-wearing-matter-v2 "$i"
          done

      - name: Storyboard and portrait preflight
        run: |
          python3 pipeline/storyboard_gate.py build/pattern-wearing-matter-v2
          python3 pipeline/portrait_storyboard_gate.py build/pattern-wearing-matter-v2

      - name: Pipeline regression tests
        run: python3 -m unittest discover -s pipeline/tests -v

      - name: API keys from repository secrets
        run: |
          printf 'ELEVENLABS_API_KEY=%s\nPEXELS_API_KEY=%s\nELEVENLABS_VOICE_ID=%s\n' \
            "${{ secrets.ELEVENLABS_API_KEY }}" "${{ secrets.PEXELS_API_KEY }}" \
            "${{ secrets.ELEVENLABS_VOICE_ID || 'TX3LPaxmHKxFdv7VOQHJ' }}" > pipeline/.env

      - name: Build portrait under adaptive Governor
        env:
          SEMANTIC_CLIP: "1"
          GOVERNOR_MODE: "recover"
          GOVERNOR_CONSOLE_HEARTBEATS: "1"
          GOVERNOR_HEARTBEAT_SECONDS: "15"
          BUILD_PASS_BUDGET: "120"
          PYTHONUNBUFFERED: "1"
        run: |
          python3 pipeline/run_governed.py build/pattern-wearing-matter-v2 \
            --max-passes 120 --overall-timeout 4800
          test -f build/pattern-wearing-matter-v2/final.mp4

      - name: Storyboard and portrait postflight
        run: |
          python3 pipeline/storyboard_gate.py build/pattern-wearing-matter-v2
          python3 pipeline/portrait_storyboard_gate.py build/pattern-wearing-matter-v2

      - name: Prepare exact-voice portrait mastering package
        shell: bash
        run: |
          rm -rf build/pattern-wearing-matter-v2/portrait_master_inputs
          mkdir -p build/pattern-wearing-matter-v2/portrait_master_inputs
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          bd=Path('build/pattern-wearing-matter-v2')
          manifest=json.loads((bd/'music_variants.json').read_text())
          delivery=manifest['delivery']
          index=int(delivery['index'])
          variant=manifest['variants'][index-1]
          chosen=bd/delivery['portrait_video']
          music=bd/variant['file']
          target=bd/'portrait_master_inputs'
          shutil.copy(chosen,target/'pipeline_preview.mp4')
          shutil.copy(music,target/'delivery_music.wav')
          (target/'mastering_manifest.json').write_text(json.dumps({
            'delivery_label':delivery['label'],
            'pipeline_video':chosen.name,
            'music_file':music.name,
            'exact_voice_sha256':'40cf81e45fa4dba595be5fcf56ca3114cadf31be14444c4566e1c5a987eecc4d',
            'exact_voice_duration':185.730563,
            'portrait_native':True,
            'instruction':'Replace proxy voice with exact supplied waveform; do not regenerate or time-stretch.'
          },indent=2),encoding='utf-8')
          PY
          ffmpeg -hide_banner -loglevel error -y \
            -i build/pattern-wearing-matter-v2/portrait_master_inputs/pipeline_preview.mp4 \
            -map 0:v:0 -c:v copy -an -movflags +faststart \
            build/pattern-wearing-matter-v2/portrait_master_inputs/video_only.mp4

      - name: Upload portrait mastering package
        uses: actions/upload-artifact@v4
        with:
          name: pattern-wearing-matter-v2-portrait-master-inputs
          compression-level: 0
          retention-days: 90
          path: |
            build/pattern-wearing-matter-v2/portrait_master_inputs/**
            build/pattern-wearing-matter-v2/storyboard_report.json
            build/pattern-wearing-matter-v2/portrait_storyboard_report.json
            build/pattern-wearing-matter-v2/quality_report.json
            build/pattern-wearing-matter-v2/visual_symbol_report.json
            build/pattern-wearing-matter-v2/motion_report.json

      - name: Commit portrait outcome and telemetry
        if: always()
        shell: bash
        run: |
          rm -f pipeline/.env
          git config user.name render-bot
          git config user.email render@users.noreply.github.com
          for f in \
            build/pattern-wearing-matter-v2/script.json \
            build/pattern-wearing-matter-v2/portrait-run-id.txt \
            build/pattern-wearing-matter-v2/storyboard_report.json \
            build/pattern-wearing-matter-v2/portrait_storyboard_report.json \
            build/pattern-wearing-matter-v2/quality_report.json \
            build/pattern-wearing-matter-v2/visual_symbol_report.json \
            build/pattern-wearing-matter-v2/motion_report.json \
            build/pattern-wearing-matter-v2/governor-summary.json \
            build/pattern-wearing-matter-v2/render-status.json; do
            git add "$f" 2>/dev/null || true
          done
          git commit -m "render pattern-wearing-matter portrait: persist audited outcome" || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git stash --include-untracked || true
            git pull --rebase origin main || git rebase --abort || true
            git stash pop || true
            sleep $((i * 2))
          done
          exit 1
