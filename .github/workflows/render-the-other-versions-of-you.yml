name: Render Other Versions of You

on:
  push:
    branches: [main]
    paths:
      - "build/the-other-versions-of-you/regenerate.request"
  workflow_dispatch:

permissions:
  contents: write

env:
  SLUG: the-other-versions-of-you
  EXPECTED_AUDIO_SHA256: 2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa
  EXPECTED_AUDIO_SIZE: "1135634"
  EXPECTED_AUDIO_DURATION: "68.754250"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > "build/$SLUG/fixed-run-id.txt"
          git config user.name "render-request-bot"
          git config user.email "render-request@users.noreply.github.com"
          git add "build/$SLUG/fixed-run-id.txt"
          git commit -m "render $SLUG: exact-audio run started $GITHUB_RUN_ID" || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Restore and verify exact attached narration
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          build="build/$SLUG"
          parts=("$build"/vo.mp3.exact.b64.part*)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" | base64 --decode > "$build/vo.mp3"

          actual_sha="$(sha256sum "$build/vo.mp3" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$build/vo.mp3")"
          actual_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$build/vo.mp3")"
          actual_format="$(ffprobe -v error -show_entries format=format_name -of default=noprint_wrappers=1:nokey=1 "$build/vo.mp3")"

          test "$actual_sha" = "$EXPECTED_AUDIO_SHA256"
          test "$actual_size" = "$EXPECTED_AUDIO_SIZE"
          python3 - "$actual_duration" "$EXPECTED_AUDIO_DURATION" <<'PY'
          import sys
          actual = float(sys.argv[1])
          expected = float(sys.argv[2])
          if abs(actual - expected) > 0.001:
              raise SystemExit(f"audio duration mismatch: {actual:.6f} != {expected:.6f}")
          PY
          case "$actual_format" in *mp3*) ;; *) echo "unexpected audio format: $actual_format" >&2; exit 1;; esac

          python3 - "$build/audio-verification.json" "$actual_sha" "$actual_size" "$actual_duration" "$actual_format" <<'PY'
          import json, pathlib, sys
          out, sha, size, duration, fmt = sys.argv[1:]
          pathlib.Path(out).write_text(json.dumps({
              "source_attachment": "ElevenLabs_2026-07-16T14_35_48_Liam - Energetic, Social Media Creator_pre_sp100_s50_sb75_v3 (1).mp3",
              "sha256": sha,
              "size_bytes": int(size),
              "duration_seconds": float(duration),
              "format": fmt,
              "exact_bytes_restored": True,
              "transcoded_before_pipeline": False,
              "pipeline_voiceover_path": "vo.mp3"
          }, indent=2) + "\n", encoding="utf-8")
          PY
          echo "verified exact attached narration: $actual_duration seconds, $actual_size bytes, $actual_sha"

      - name: Python dependencies
        run: pip install -q -r pipeline/requirements.txt

      - name: Pipeline regression tests
        run: python3 -m unittest discover -s pipeline/tests -v

      - name: API keys
        shell: bash
        run: |
          printf 'ELEVENLABS_API_KEY=%s\nPEXELS_API_KEY=%s\nELEVENLABS_VOICE_ID=%s\n' \
            "${{ secrets.ELEVENLABS_API_KEY }}" "${{ secrets.PEXELS_API_KEY }}" \
            "${{ secrets.ELEVENLABS_VOICE_ID || 'TX3LPaxmHKxFdv7VOQHJ' }}" > pipeline/.env

      - name: Build with TikTok Video Pipeline under adaptive Governor
        env:
          SEMANTIC_CLIP: "1"
          GOVERNOR_MODE: "recover"
          GOVERNOR_CONSOLE_HEARTBEATS: "1"
          GOVERNOR_HEARTBEAT_SECONDS: "15"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          test -s "build/$SLUG/vo.mp3"
          test "$(sha256sum "build/$SLUG/vo.mp3" | awk '{print $1}')" = "$EXPECTED_AUDIO_SHA256"
          python3 pipeline/run_governed.py "build/$SLUG" --max-passes 200 --overall-timeout 4680
          test -s "build/$SLUG/final.mp4"
          test -s "build/$SLUG/final_youtube.mp4"
          test -s "build/$SLUG/scene-review.html"
          test -s "build/$SLUG/music_variants.json"
          test -s "build/$SLUG/motion_report.json"
          test -s "build/$SLUG/visual_symbol_report.json"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "build/$SLUG/final.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "build/$SLUG/final_youtube.mp4"

      - name: Upload finished delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}-exact-audio
          retention-days: 30
          path: |
            build/${{ env.SLUG }}/final*.mp4
            build/${{ env.SLUG }}/scene-review.html
            build/${{ env.SLUG }}/scene-review.json
            build/${{ env.SLUG }}/music_variants.json
            build/${{ env.SLUG }}/motion_report.json
            build/${{ env.SLUG }}/motion_report_short.json
            build/${{ env.SLUG }}/visual_symbol_report.json
            build/${{ env.SLUG }}/still_reference_report.json
            build/${{ env.SLUG }}/quality_report.json
            build/${{ env.SLUG }}/audio-verification.json
            build/${{ env.SLUG }}/alts_sheet.jpg
            build/${{ env.SLUG }}/CREDITS.txt

      - name: Publish permanent release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="video-$SLUG"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$SLUG" --notes "Regenerated with exact attached MP3 by run $GITHUB_RUN_ID"
          shopt -s nullglob
          for file in build/$SLUG/final*.mp4 build/$SLUG/scene-review.html build/$SLUG/scene-review.json build/$SLUG/music_variants.json build/$SLUG/motion_report.json build/$SLUG/visual_symbol_report.json build/$SLUG/still_reference_report.json build/$SLUG/quality_report.json build/$SLUG/audio-verification.json build/$SLUG/alts_sheet.jpg build/$SLUG/CREDITS.txt; do
            test -f "$file" && gh release upload "$tag" "$file" --clobber
          done

      - name: Persist outcome
        if: always()
        shell: bash
        run: |
          rm -f pipeline/.env "build/$SLUG/vo.mp3"
          git config user.name "render-bot"
          git config user.email "render@users.noreply.github.com"
          for file in pipeline/memory.json pipeline/visual_symbols.py "build/$SLUG/script.json" "build/$SLUG/fixed-run-id.txt" "build/$SLUG/render-status.json" "build/$SLUG/quality_report.json" "build/$SLUG/audio-verification.json" "build/$SLUG/scene-review.json" "build/$SLUG/alts.json" "build/$SLUG/governor-summary.json" "build/$SLUG/governor-review.json"; do
            git add "$file" 2>/dev/null || true
          done
          git commit -m "render $SLUG: persist exact-audio outcome" || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git stash --include-untracked || true
            git pull --rebase origin main || git rebase --abort || true
            git stash pop || true
            sleep $((i * 2))
          done
          exit 1
