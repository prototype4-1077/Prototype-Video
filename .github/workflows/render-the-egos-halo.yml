name: Render The Ego's Halo

on:
  push:
    branches:
      - main
    paths:
      - build/the-egos-halo/render.trigger

permissions:
  contents: write

jobs:
  render:
    permissions:
      contents: write
    uses: ./.github/workflows/render.yml
    with:
      slug: the-egos-halo

  record-status:
    if: ${{ always() }}
    needs:
      - render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record caller status
        shell: bash
        run: |
          mkdir -p build/the-egos-halo
          printf '%s\n' '${{ github.run_id }}' > build/the-egos-halo/caller-run-id.txt
          printf '%s\n' '${{ needs.render.result }}' > build/the-egos-halo/caller-conclusion.txt
          git config user.name render-bot
          git config user.email render@users.noreply.github.com
          git add build/the-egos-halo/caller-run-id.txt build/the-egos-halo/caller-conclusion.txt
          git commit -m 'render the-egos-halo: record status' || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
          done
          exit 1
