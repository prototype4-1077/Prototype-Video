name: Render Other Versions Stock First Rebuild V2

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first-rebuild/render-v2.request"
  workflow_dispatch:

permissions:
  contents: write

env:
  SLUG: other-versions-stock-first-rebuild
  EXPECTED_AUDIO_SHA256: 2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa
  EXPECTED_AUDIO_SIZE: "1135634"
  EXPECTED_AUDIO_DURATION: "68.754250"
  AUDIO_CIPHERTEXT_URL: https://filebin.net/a3f76c91d8e4420fbb6c1de2a94f7c83/narration.bin
  AUDIO_DECRYPTION_PASSPHRASE: 2f063b08-OV-stock-first-7ad4c891-20260716

concurrency:
  group: render-other-versions-stock-first-rebuild
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run id immediately
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > "build/$SLUG/active-run-id.txt"
          git config user.name "render-request-bot"
          git config user.email "render-request@users.noreply.github.com"
          git add "build/$SLUG/active-run-id.txt"
          git commit -m "stock-first rebuild v2 started $GITHUB_RUN_ID" || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || git rebase --abort || true
            git push && exit 0
            sleep $((i * 2))
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/clipcache
            /tmp/models
          key: models-v1

      - name: System dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg openssl

      - name: Restore exact attached narration from encrypted transport
        shell: bash
        run: |
          set -euo pipefail
          build="build/$SLUG"
          mkdir -p "$build"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$AUDIO_CIPHERTEXT_URL" -o /tmp/narration.bin
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/narration.bin -out "$build/vo.mp3" \
            -pass pass:"$AUDIO_DECRYPTION_PASSPHRASE"

          actual_sha="$(sha256sum "$build/vo.mp3" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$build/vo.mp3")"
          actual_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$build/vo.mp3")"
          test "$actual_sha" = "$EXPECTED_AUDIO_SHA256"
          test "$actual_size" = "$EXPECTED_AUDIO_SIZE"
          python3 - "$actual_duration" "$EXPECTED_AUDIO_DURATION" <<'PY'
          import sys
          actual = float(sys.argv[1])
          expected = float(sys.argv[2])
          if abs(actual - expected) > 0.001:
              raise SystemExit(f"Exact audio duration mismatch: {actual:.6f} != {expected:.6f}")
          PY
          python3 - "$build/audio-verification.json" "$actual_sha" "$actual_size" "$actual_duration" <<'PY'
          import json, pathlib, sys
          output, sha, size, duration = sys.argv[1:]
          pathlib.Path(output).write_text(json.dumps({
              "source_attachment": "ElevenLabs_2026-07-16T14_35_48_Liam - Energetic, Social Media Creator_pre_sp100_s50_sb75_v3 (1)(1).mp3",
              "transport": "temporary encrypted AES-256-CBC transfer",
              "sha256": sha,
              "size_bytes": int(size),
              "duration_seconds": float(duration),
              "exact_bytes_restored": True,
              "transcoded_before_pipeline": False,
              "pipeline_voiceover_path": "vo.mp3"
          }, indent=2) + "\n", encoding="utf-8")
          PY
          echo "Exact attached narration verified: $actual_sha, $actual_size bytes, $actual_duration seconds"

      - name: Remove every inherited or generated visual asset
        shell: bash
        run: |
          set -euo pipefail
          find "build/$SLUG" -maxdepth 1 -type f \( \
            -name 'clip_*.mp4' -o -name 'seg_*.mp4' -o -name 'seg_youtube_*.mp4' -o \
            -name 'final*.mp4' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o \
            -name 'enhanced_still_*' -o -name 'stock_reference_*' -o -name 'words*.json' -o \
            -name 'alts.json' -o -name 'scene-review.*' -o -name 'motion_report*.json' -o \
            -name 'visual_symbol_report.json' -o -name 'still_reference_report.json' -o \
            -name 'music_variants.json' -o -name 'quality_report.json' \
          \) -delete
          test -s "build/$SLUG/vo.mp3"
          test -s "build/$SLUG/script.json"

      - name: Python dependencies
        run: pip install -q -r pipeline/requirements.txt

      - name: Pipeline regression tests
        run: python3 -m unittest discover -s pipeline/tests -v

      - name: Record durable stock-first feedback
        run: |
          python3 pipeline/learn.py note "Other Versions of You was fully rejected. Start ordinary videos from genuine literal stock footage for every scene. Do not use deterministic symbolic graphics, generic low-grade graphics, hero images, or stills unless exact stock searching has genuinely failed and James explicitly accepts a substantially higher-grade fallback. Narrative correspondence and premium photographic realism outrank abstract visual cleverness."

      - name: API keys
        shell: bash
        run: |
          printf 'ELEVENLABS_API_KEY=%s\nPEXELS_API_KEY=%s\nELEVENLABS_VOICE_ID=%s\n' \
            "${{ secrets.ELEVENLABS_API_KEY }}" "${{ secrets.PEXELS_API_KEY }}" \
            "${{ secrets.ELEVENLABS_VOICE_ID || 'TX3LPaxmHKxFdv7VOQHJ' }}" > pipeline/.env

      - name: Build with TikTok Video Pipeline under adaptive Governor
        env:
          SEMANTIC_CLIP: "1"
          GOVERNOR_MODE: "recover"
          GOVERNOR_CONSOLE_HEARTBEATS: "1"
          GOVERNOR_HEARTBEAT_SECONDS: "15"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "build/$SLUG/vo.mp3" | awk '{print $1}')" = "$EXPECTED_AUDIO_SHA256"
          python3 pipeline/run_governed.py "build/$SLUG" --max-passes 200 --overall-timeout 4680
          test -s "build/$SLUG/final.mp4"
          test -s "build/$SLUG/scene-review.html"
          test -s "build/$SLUG/scene-review.json"
          test -s "build/$SLUG/music_variants.json"
          dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "build/$SLUG/final.mp4")"
          test "$dims" = "1080x1920"

      - name: Enforce genuine stock footage for all sixteen scenes
        run: python3 "build/$SLUG/verify_stock_only.py"

      - name: Upload finished delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: other-versions-stock-first-rebuild-v2
          retention-days: 30
          path: |
            build/${{ env.SLUG }}/final.mp4
            build/${{ env.SLUG }}/scene-review.html
            build/${{ env.SLUG }}/scene-review.json
            build/${{ env.SLUG }}/music_variants.json
            build/${{ env.SLUG }}/motion_report.json
            build/${{ env.SLUG }}/visual_symbol_report.json
            build/${{ env.SLUG }}/still_reference_report.json
            build/${{ env.SLUG }}/quality_report.json
            build/${{ env.SLUG }}/stock-only-report.json
            build/${{ env.SLUG }}/audio-verification.json
            build/${{ env.SLUG }}/alts_sheet.jpg
            build/${{ env.SLUG }}/alts.json
            build/${{ env.SLUG }}/CREDITS.txt

      - name: Publish permanent release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="video-$SLUG"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Other Versions of You — Stock First Rebuild" \
              --notes "Fresh genuine-stock-only TikTok Pipeline render using the exact attached MP3. Run $GITHUB_RUN_ID."
          for file in \
            "build/$SLUG/final.mp4" \
            "build/$SLUG/scene-review.html" \
            "build/$SLUG/scene-review.json" \
            "build/$SLUG/music_variants.json" \
            "build/$SLUG/motion_report.json" \
            "build/$SLUG/visual_symbol_report.json" \
            "build/$SLUG/still_reference_report.json" \
            "build/$SLUG/quality_report.json" \
            "build/$SLUG/stock-only-report.json" \
            "build/$SLUG/audio-verification.json" \
            "build/$SLUG/alts_sheet.jpg" \
            "build/$SLUG/CREDITS.txt"; do
            test -f "$file" && gh release upload "$tag" "$file" --clobber
          done

      - name: Persist pipeline learning and outcome
        if: always()
        shell: bash
        run: |
          rm -f pipeline/.env "build/$SLUG/vo.mp3" /tmp/narration.bin
          printf '%s\n' "$GITHUB_RUN_ID" > "build/$SLUG/run-id.txt"
          git config user.name "render-bot"
          git config user.email "render@users.noreply.github.com"
          for file in \
            pipeline/memory.json \
            "build/$SLUG/script.json" \
            "build/$SLUG/active-run-id.txt" \
            "build/$SLUG/run-id.txt" \
            "build/$SLUG/audio-verification.json" \
            "build/$SLUG/stock-only-report.json" \
            "build/$SLUG/render-status.json" \
            "build/$SLUG/quality_report.json" \
            "build/$SLUG/scene-review.json" \
            "build/$SLUG/alts.json" \
            "build/$SLUG/governor-summary.json" \
            "build/$SLUG/governor-review.json"; do
            git add "$file" 2>/dev/null || true
          done
          git commit -m "render $SLUG v2: persist stock-first outcome" || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git stash --include-untracked || true
            git pull --rebase origin main || git rebase --abort || true
            git stash pop || true
            sleep $((i * 2))
          done
          exit 1
