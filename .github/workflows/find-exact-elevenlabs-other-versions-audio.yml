name: Find Exact ElevenLabs Other Versions Audio

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/find-elevenlabs-exact-audio.request"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Search ElevenLabs history and checksum candidates
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ELEVENLABS_API_KEY"
          expected=2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa
          build=build/other-versions-stock-first
          report="$build/elevenlabs-history-audio-report.jsonl"
          : > "$report"
          rm -f /tmp/exact-attached.mp3
          cursor=""
          for page in $(seq 1 20); do
            url='https://api.elevenlabs.io/v1/history?page_size=100'
            if [ -n "$cursor" ]; then
              url="$url&start_after_history_item_id=$cursor"
            fi
            curl -fsS -H "xi-api-key: $ELEVENLABS_API_KEY" "$url" -o /tmp/history.json
            python3 - /tmp/history.json /tmp/history-items.tsv <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          rows=[]
          for item in data.get('history',[]):
              text=' '.join(str(item.get('text') or '').split())
              rows.append((str(item.get('history_item_id') or ''),str(item.get('date_unix') or ''),str(item.get('voice_id') or ''),text[:300]))
          with open(sys.argv[2],'w',encoding='utf-8') as f:
              for row in rows:
                  f.write('\t'.join(x.replace('\t',' ') for x in row)+'\n')
          print(data.get('last_history_item_id') or '')
          PY
            next_cursor="$(python3 -c 'import json; d=json.load(open("/tmp/history.json")); print(d.get("last_history_item_id") or "")')"
            while IFS=$'\t' read -r item_id date_unix voice_id text; do
              [ -n "$item_id" ] || continue
              # Prioritize the Liam voice and the supplied script, but checksum every recent item.
              curl -fsS -H "xi-api-key: $ELEVENLABS_API_KEY" \
                -H 'Accept: audio/mpeg' \
                "https://api.elevenlabs.io/v1/history/$item_id/audio" \
                -o "/tmp/$item_id.mp3" || continue
              sha="$(sha256sum "/tmp/$item_id.mp3" | awk '{print $1}')"
              size="$(stat -c '%s' "/tmp/$item_id.mp3")"
              python3 - "$report" "$item_id" "$date_unix" "$voice_id" "$sha" "$size" "$text" <<'PY'
          import json,sys
          path,item,date,voice,sha,size,text=sys.argv[1:]
          with open(path,'a',encoding='utf-8') as f:
              f.write(json.dumps({'history_item_id':item,'date_unix':date,'voice_id':voice,'sha256':sha,'size_bytes':int(size),'text_preview':text},ensure_ascii=False)+'\n')
          PY
              if [ "$sha" = "$expected" ]; then
                cp "/tmp/$item_id.mp3" /tmp/exact-attached.mp3
                printf '%s\n' "$item_id" > "$build/elevenlabs-exact-history-item-id.txt"
                break 2
              fi
            done < /tmp/history-items.tsv
            has_more="$(python3 -c 'import json; d=json.load(open("/tmp/history.json")); print(str(bool(d.get("has_more"))).lower())')"
            [ "$has_more" = true ] || break
            [ -n "$next_cursor" ] || break
            cursor="$next_cursor"
          done
          rm -f "$build"/ELEVENLABS_EXACT_*.marker
          if [ -s /tmp/exact-attached.mp3 ]; then
            test "$(sha256sum /tmp/exact-attached.mp3 | awk '{print $1}')" = "$expected"
            printf 'found=true\nsha256=%s\n' "$expected" > "$build/ELEVENLABS_EXACT_FOUND.marker"
            state=FOUND
          else
            printf 'found=false\n' > "$build/ELEVENLABS_EXACT_NONE.marker"
            state=NONE
          fi
          git config user.name diagnostic-bot
          git config user.email diagnostic@users.noreply.github.com
          git add "$report" "$build"/ELEVENLABS_EXACT_*.marker "$build/elevenlabs-exact-history-item-id.txt" 2>/dev/null || true
          git commit -m "diagnostic stock-v2 ELEVENLABS_EXACT_${state}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
