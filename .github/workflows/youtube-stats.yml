name: Refresh YouTube audience statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * *"
  push:
    branches: [main]
    paths:
      - "pipeline/yt_published_result.json"
      - "pipeline/published_videos.json"
      - "pipeline/yt_stats_refresh.py"
      - ".github/workflows/youtube-stats.yml"

permissions:
  contents: write

concurrency:
  group: youtube-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Refresh public performance snapshots
        id: refresh
        continue-on-error: true
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          python3 pipeline/yt_stats_refresh.py | tee /tmp/youtube-stats-refresh.txt

      - name: Validate and summarize refresh status
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          status = json.load(open('pipeline/youtube_stats_status.json', encoding='utf-8'))
          print(json.dumps(status, indent=2, ensure_ascii=False))
          if status.get('status') != 'success':
              print('::warning title=YouTube statistics unavailable::' + str(status.get('required_action') or status.get('error')))
          else:
              print(f"updated {status.get('updated_count', 0)} YouTube snapshots")
          PY

      - name: Commit status and age-normalized snapshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "youtube-stats-bot"
          git config user.email "youtube-stats@users.noreply.github.com"
          git add pipeline/youtube_stats_status.json 2>/dev/null || true
          git add build/*/yt_stats.json build/*/legacy_retention_stats.json 2>/dev/null || true
          git commit -m "analytics: refresh YouTube public statistics" || exit 0
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((i * 2))
          done
          echo "statistics refresh completed but evidence could not be persisted" >&2
          exit 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: youtube-stats-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/youtube-stats-refresh.txt
            pipeline/youtube_stats_status.json
            build/*/yt_stats.json

      - name: Enforce collector outcome after preserving evidence
        if: always()
        env:
          COLLECTOR_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          status = json.load(open('pipeline/youtube_stats_status.json', encoding='utf-8'))
          assert os.environ['COLLECTOR_OUTCOME'] == 'success', status.get('required_action') or status.get('status')
          assert status.get('status') in {'success', 'no_data'}, status
          if status['status'] == 'success':
              assert status.get('updated_count', 0) > 0, 'zero-update collection cannot report success'
          PY
