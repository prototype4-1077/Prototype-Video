name: Diagnose Other Versions Stock V2 State

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/diagnose-stock-v2-state.request"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish explicit state marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          build=build/other-versions-stock-first
          status="$(gh run view 29527676526 --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
          conclusion="$(gh run view 29527676526 --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // "none"')"
          rm -f "$build"/STATE_*.marker
          printf 'run_id=29527676526\nstatus=%s\nconclusion=%s\n' "$status" "$conclusion" > "$build/STATE_${status}_${conclusion}.marker"
          git config user.name diagnostic-bot
          git config user.email diagnostic@users.noreply.github.com
          git add -A "$build"/STATE_*.marker
          git commit -m "diagnostic stock-v2 RUN_STATUS_${status} CONCLUSION_${conclusion}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
