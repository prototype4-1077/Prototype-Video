name: Scan All Other Versions Audio Parts

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/scan-all-audio-parts.request"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Discover and test every base64 part prefix
        shell: bash
        run: |
          set -euo pipefail
          expected=2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa
          build=build/other-versions-stock-first
          report="$build/all-audio-part-groups-report.txt"
          : > "$report"
          find build/the-other-versions-of-you build/other-versions-stock-first -maxdepth 1 -type f \( -name '*.part*' -o -name '*part*' \) -printf '%p %s\n' | sort >> "$report" || true
          python3 - <<'PY'
          import base64, glob, hashlib, json, os, pathlib, re, subprocess
          expected='2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa'
          roots=[pathlib.Path('build/the-other-versions-of-you'),pathlib.Path('build/other-versions-stock-first')]
          groups={}
          for root in roots:
              if not root.exists(): continue
              for p in root.iterdir():
                  if not p.is_file() or 'part' not in p.name.lower(): continue
                  m=re.match(r'^(.*?part)[._-]?(\d+)$',p.name,re.I)
                  if not m: continue
                  groups.setdefault(str(root/m.group(1)),[]).append((int(m.group(2)),p))
          rows=[]; winners=[]
          for prefix,items in sorted(groups.items()):
              items.sort()
              raw=''.join(p.read_text(encoding='utf-8',errors='ignore') for _,p in items)
              compact=''.join(raw.split())
              row={'prefix':prefix,'parts':[p.name for _,p in items],'chars':len(compact)}
              try:
                  data=base64.b64decode(compact,validate=True)
                  row['bytes']=len(data); row['sha256']=hashlib.sha256(data).hexdigest()
                  temp=pathlib.Path('/tmp')/(hashlib.sha1(prefix.encode()).hexdigest()+'.mp3')
                  temp.write_bytes(data)
                  pr=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(temp)],capture_output=True,text=True)
                  row['duration']=pr.stdout.strip()
                  if row['sha256']==expected:
                      winners.append(prefix)
                      pathlib.Path('/tmp/exact-audio-winner.mp3').write_bytes(data)
              except Exception as exc:
                  row['error']=str(exc)
              rows.append(row)
          pathlib.Path('build/other-versions-stock-first/all-audio-part-groups.json').write_text(json.dumps({'rows':rows,'winners':winners},indent=2)+'\n')
          winner='NONE' if not winners else re.sub(r'[^A-Za-z0-9]+','_',winners[-1]).strip('_')
          pathlib.Path('build/other-versions-stock-first/all-audio-parts-winner.txt').write_text(winner+'\n')
          pathlib.Path(f'build/other-versions-stock-first/ALL_AUDIO_PARTS_{winner}.marker').write_text('\n'.join(winners)+'\n')
          PY
          winner="$(cat "$build/all-audio-parts-winner.txt")"
          git config user.name diagnostic-bot
          git config user.email diagnostic@users.noreply.github.com
          git add "$report" "$build/all-audio-part-groups.json" "$build/all-audio-parts-winner.txt" "$build"/ALL_AUDIO_PARTS_*.marker
          git commit -m "diagnostic stock-v2 ALL_AUDIO_PARTS_${winner}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
