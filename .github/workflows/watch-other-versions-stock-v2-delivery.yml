name: Watch Other Versions Stock V2 Delivery

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/watch-delivery.request"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-other-versions-stock-v2-delivery
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install media tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Wait for verified permanent release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="video-other-versions-stock-first-stock-v2"
          for attempt in $(seq 1 300); do
            if gh release view "$tag" >/dev/null 2>&1; then
              rm -rf /tmp/other-versions-delivery
              mkdir -p /tmp/other-versions-delivery
              if gh release download "$tag" --dir /tmp/other-versions-delivery \
                --pattern 'Other_Versions_of_You_Stock_First_TikTok.mp4' \
                --pattern 'scene-review.html' \
                --pattern 'scene-review.json' \
                --pattern 'stock-only-verification.json' \
                --pattern 'audio-verification.json' \
                --pattern 'motion_report.json' \
                --pattern 'visual_symbol_report.json' \
                --pattern 'CREDITS.txt'; then
                test -s /tmp/other-versions-delivery/Other_Versions_of_You_Stock_First_TikTok.mp4 && break
              fi
            fi
            sleep 15
          done
          test -s /tmp/other-versions-delivery/Other_Versions_of_You_Stock_First_TikTok.mp4

      - name: Verify and persist direct delivery
        shell: bash
        run: |
          set -euo pipefail
          video=/tmp/other-versions-delivery/Other_Versions_of_You_Stock_First_TikTok.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$video")" = "1080x1920"
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('/tmp/other-versions-delivery')
          stock = json.loads((root/'stock-only-verification.json').read_text())
          audio = json.loads((root/'audio-verification.json').read_text())
          assert stock.get('passed') is True
          assert float(stock.get('still_source_ratio')) == 0.0
          assert float(stock.get('true_motion_ratio')) >= 0.999
          assert all(row.get('passed') for row in stock.get('scenes', []))
          assert audio.get('sha256') == '2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa'
          assert audio.get('exact_bytes_restored') is True
          PY
          dest=deliveries/other-versions-stock-first-v2
          rm -rf "$dest"
          mkdir -p "$dest"
          cp /tmp/other-versions-delivery/Other_Versions_of_You_Stock_First_TikTok.mp4 "$dest/"
          for f in scene-review.html scene-review.json stock-only-verification.json audio-verification.json motion_report.json visual_symbol_report.json CREDITS.txt; do
            test -f "/tmp/other-versions-delivery/$f" && cp "/tmp/other-versions-delivery/$f" "$dest/$f"
          done
          printf '{"state":"ready","video":"Other_Versions_of_You_Stock_First_TikTok.mp4","stock_only":true,"exact_audio":true}\n' > "$dest/delivery-status.json"
          git config user.name delivery-bot
          git config user.email delivery@users.noreply.github.com
          git add -f "$dest"
          git commit -m 'delivery: persist guarded Other Versions stock-first TikTok' || true
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
