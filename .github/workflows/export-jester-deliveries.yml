name: Export Jester deliveries

on:
  push:
    paths:
      - ".github/workflows/export-jester-deliveries.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: video-jester-who-knew-my-name
    steps:
      - name: Mark export run
        run: |
          marker="repos/$GITHUB_REPOSITORY/contents/build/jester-who-knew-my-name/export-started.txt"
          content="$(printf '%s\n' "$GITHUB_RUN_ID" | base64 -w0)"
          sha="$(gh api "$marker" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "$marker" -f message="Update Jester export run" -f content="$content" -f branch="$GITHUB_REF_NAME" -f sha="$sha"
          else
            gh api --method PUT "$marker" -f message="Mark Jester export started" -f content="$content" -f branch="$GITHUB_REF_NAME"
          fi
      - name: Download selected release assets
        run: |
          mkdir -p delivery reports
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          jq -r '.assets[] | [.name, (.label // ""), (.size | tostring)] | @tsv' release.json

          portrait_url="$(jq -r '.assets[] | select(.name == "final.mp4" or .name == "jester-who-knew-my-name.mp4" or (.label // "") == "jester-who-knew-my-name.mp4") | .url' release.json | head -n 1)"
          youtube_url="$(jq -r '.assets[] | select(.name == "final_youtube.mp4" or .name == "jester-who-knew-my-name-youtube.mp4" or (.label // "") == "jester-who-knew-my-name-youtube.mp4") | .url' release.json | head -n 1)"
          test -n "$portrait_url"
          test -n "$youtube_url"
          gh api "$portrait_url" -H "Accept: application/octet-stream" > delivery/final.mp4
          gh api "$youtube_url" -H "Accept: application/octet-stream" > delivery/final_youtube.mp4

          for asset in music_variants.json motion_report.json visual_symbol_report.json still_reference_report.json alts_sheet.jpg CREDITS.txt; do
            url="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .url' release.json | head -n 1)"
            test -n "$url"
            gh api "$url" -H "Accept: application/octet-stream" > "reports/$asset"
          done
      - name: Upload portrait delivery
        uses: actions/upload-artifact@v4
        with:
          name: jester-delivery-portrait
          path: delivery/final.mp4
          compression-level: 0
      - name: Upload YouTube delivery
        uses: actions/upload-artifact@v4
        with:
          name: jester-delivery-youtube
          path: delivery/final_youtube.mp4
          compression-level: 0
      - name: Upload QA package
        uses: actions/upload-artifact@v4
        with:
          name: jester-delivery-qa
          path: reports
