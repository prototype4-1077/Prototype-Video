name: Export Jester deliveries

on:
  push:
    paths:
      - ".github/workflows/export-jester-deliveries.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: video-jester-who-knew-my-name
    steps:
      - name: Mark export run
        run: |
          content="$(printf '%s\n' "$GITHUB_RUN_ID" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build/jester-who-knew-my-name/export-started.txt" \
            -f message="Mark Jester export started" -f content="$content" -f branch="$GITHUB_REF_NAME"
      - name: Download selected release assets
        run: |
          mkdir -p delivery reports
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "final.mp4" --dir delivery
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "final_youtube.mp4" --dir delivery
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "music_variants.json" --dir reports
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "motion_report.json" --dir reports
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "visual_symbol_report.json" --dir reports
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "still_reference_report.json" --dir reports
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "alts_sheet.jpg" --dir reports
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "CREDITS.txt" --dir reports
      - name: Upload portrait delivery
        uses: actions/upload-artifact@v4
        with:
          name: jester-delivery-portrait
          path: delivery/final.mp4
          compression-level: 0
      - name: Upload YouTube delivery
        uses: actions/upload-artifact@v4
        with:
          name: jester-delivery-youtube
          path: delivery/final_youtube.mp4
          compression-level: 0
      - name: Upload QA package
        uses: actions/upload-artifact@v4
        with:
          name: jester-delivery-qa
          path: reports
