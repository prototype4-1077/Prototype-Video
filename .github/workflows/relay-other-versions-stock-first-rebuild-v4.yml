name: Relay Other Versions Stock First Rebuild V4

on:
  workflow_run:
    workflows: ["Repair Other Versions Stock First After V3"]
    types: [completed]

permissions:
  actions: read

env:
  RELAY_URL: https://filebin.net/e7f18c53b4a941aeb26d0c7f9a35d842/delivery.json

jobs:
  relay:
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish temporary delivery pointer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess,time,urllib.request
          run_id=int(os.environ['RUN_ID']); conclusion=os.environ['CONCLUSION']; token=os.environ['GH_TOKEN']
          payload={'workflow':'Repair Other Versions Stock First After V3','run_id':run_id,'conclusion':conclusion}
          if conclusion=='success':
              time.sleep(8)
              headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'stock-first-relay-v4'}
              req=urllib.request.Request(f'https://api.github.com/repos/jameswatson1077/tiktok-videos/actions/runs/{run_id}/artifacts',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: artifacts=json.load(r).get('artifacts') or []
              artifact=next((a for a in artifacts if a.get('name')=='other-versions-stock-first-rebuild-v4'),artifacts[0] if artifacts else None)
              if artifact is None: raise SystemExit('successful V4 has no artifact')
              aid=int(artifact['id'])
              req=urllib.request.Request(f'https://api.github.com/repos/jameswatson1077/tiktok-videos/actions/artifacts/{aid}/zip',headers=headers)
              with urllib.request.build_opener(urllib.request.HTTPRedirectHandler()).open(req,timeout=30) as r: signed=r.geturl()
              payload.update({'artifact_id':aid,'artifact_name':artifact.get('name'),'artifact_size_bytes':artifact.get('size_in_bytes'),'signed_download_url':signed})
          else:
              result=subprocess.run(['gh','run','view',str(run_id),'--repo','jameswatson1077/tiktok-videos','--log-failed'],capture_output=True,text=True)
              text=(result.stdout or '')+'\n'+(result.stderr or '')
              payload['failure_excerpt']=[line for line in text.splitlines() if 'ERROR' in line or 'FIX' in line or 'failed' in line.lower() or 'exact' in line.lower()][-50:]
              payload['failure_log_tail']=text[-16000:]
          pathlib.Path('/tmp/delivery-v4.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
          curl --fail --silent --show-error --retry 5 --retry-delay 2 -X POST --data-binary @/tmp/delivery-v4.json "$RELAY_URL"
