name: Split room-before-birth delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/split-room-before-birth.yml"

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Download completed render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p extracted delivery qa
          gh run download 29460182037 --repo "$GITHUB_REPOSITORY" --name room-before-birth --dir extracted

      - name: Select Deep Current delivery and reports
        shell: python
        run: |
          import json
          import shutil
          from pathlib import Path

          root = Path("extracted")
          manifest_path = next(root.rglob("music_variants.json"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          delivery = manifest["delivery"]
          if str(delivery.get("label", "")).strip().casefold() != "deep current":
              raise SystemExit(f"unexpected delivery label: {delivery.get('label')}")

          def locate(name):
              matches = list(root.rglob(Path(name).name))
              if len(matches) != 1:
                  raise SystemExit(f"expected one {name}, found {len(matches)}")
              return matches[0]

          portrait = locate(delivery["portrait_video"])
          youtube = locate(delivery["youtube_video"])
          shutil.copy2(portrait, "delivery/DMT-The-Room-Before-Birth-TikTok.mp4")
          shutil.copy2(youtube, "delivery/DMT-The-Room-Before-Birth-YouTube.mp4")

          for name in [
              "music_variants.json",
              "motion_report.json",
              "visual_symbol_report.json",
              "still_reference_report.json",
              "CREDITS.txt",
          ]:
              matches = list(root.rglob(name))
              if matches:
                  shutil.copy2(matches[0], Path("qa") / name)

      - name: Record media metadata
        run: |
          ffprobe -v error -show_streams -show_format -of json delivery/DMT-The-Room-Before-Birth-TikTok.mp4 > qa/portrait-ffprobe.json
          ffprobe -v error -show_streams -show_format -of json delivery/DMT-The-Room-Before-Birth-YouTube.mp4 > qa/youtube-ffprobe.json
          sha256sum delivery/*.mp4 > qa/delivery-sha256.txt

      - name: Upload portrait delivery
        uses: actions/upload-artifact@v4
        with:
          name: room-before-birth-delivery-portrait
          path: delivery/DMT-The-Room-Before-Birth-TikTok.mp4
          compression-level: 0

      - name: Upload YouTube delivery
        uses: actions/upload-artifact@v4
        with:
          name: room-before-birth-delivery-youtube
          path: delivery/DMT-The-Room-Before-Birth-YouTube.mp4
          compression-level: 0

      - name: Upload QA reports
        uses: actions/upload-artifact@v4
        with:
          name: room-before-birth-qa
          path: qa/**
