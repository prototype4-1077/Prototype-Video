name: Persist Other Versions Stock V2 Delivery

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first/stock-v2-status.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: persist-other-versions-stock-v2
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Confirm successful source render
        id: status
        shell: bash
        run: |
          set -euo pipefail
          state="$(python3 -c 'import json; print(json.load(open("build/other-versions-stock-first/stock-v2-status.json"))["state"])')"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          test "$state" = "success"

      - name: Install media tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Download permanent release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/other-versions-delivery
          mkdir -p /tmp/other-versions-delivery
          gh release download video-other-versions-stock-first-stock-v2 \
            --dir /tmp/other-versions-delivery \
            --pattern 'Other_Versions_of_You_Stock_First_TikTok.mp4' \
            --pattern 'scene-review.html' \
            --pattern 'scene-review.json' \
            --pattern 'stock-only-verification.json' \
            --pattern 'audio-verification.json' \
            --pattern 'motion_report.json' \
            --pattern 'visual_symbol_report.json' \
            --pattern 'CREDITS.txt'
          test -s /tmp/other-versions-delivery/Other_Versions_of_You_Stock_First_TikTok.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x /tmp/other-versions-delivery/Other_Versions_of_You_Stock_First_TikTok.mp4)" = "1080x1920"
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('/tmp/other-versions-delivery')
          stock = json.loads((root/'stock-only-verification.json').read_text())
          audio = json.loads((root/'audio-verification.json').read_text())
          assert stock.get('passed') is True, stock
          assert stock.get('still_source_ratio') == 0.0, stock
          assert stock.get('true_motion_ratio') >= 0.999, stock
          assert audio.get('sha256') == '2f063b082d2e019539b9d855c1e5a02f063a46abcbc1647a1be03b3e3bb710fa', audio
          assert audio.get('exact_bytes_restored') is True, audio
          PY

      - name: Store verified delivery in repository
        shell: bash
        run: |
          set -euo pipefail
          dest="deliveries/other-versions-stock-first-v2"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp /tmp/other-versions-delivery/Other_Versions_of_You_Stock_First_TikTok.mp4 "$dest/"
          for f in scene-review.html scene-review.json stock-only-verification.json audio-verification.json motion_report.json visual_symbol_report.json CREDITS.txt; do
            test -f "/tmp/other-versions-delivery/$f" && cp "/tmp/other-versions-delivery/$f" "$dest/$f"
          done
          printf '{"state":"ready","source_tag":"video-other-versions-stock-first-stock-v2","video":"Other_Versions_of_You_Stock_First_TikTok.mp4"}\n' > "$dest/delivery-status.json"
          git config user.name "delivery-bot"
          git config user.email "delivery@users.noreply.github.com"
          git add -f "$dest"
          git commit -m "delivery: publish verified Other Versions stock-first TikTok"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main || git rebase --abort || true
            sleep $((i * 2))
          done
          exit 1
