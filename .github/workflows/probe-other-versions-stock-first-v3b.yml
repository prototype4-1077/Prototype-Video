name: Probe Other Versions Stock First V3B

on:
  push:
    branches: [main]
    paths:
      - "build/other-versions-stock-first-rebuild/probe-v3b.request"

permissions:
  actions: read
  contents: read

env:
  OUTPUT_URL: https://filebin.net/f29a6c8d347b41f0b8e25d6a9c73e154/progress-b.json

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe active render
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat build/other-versions-stock-first-rebuild/active-run-id-v3.txt)"
          python3 - "$run_id" <<'PY'
          import json,os,pathlib,subprocess,sys,urllib.request
          run_id=int(sys.argv[1]); token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'stock-first-probe-b'}
          req=urllib.request.Request(f'https://api.github.com/repos/jameswatson1077/tiktok-videos/actions/runs/{run_id}',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r: run=json.load(r)
          payload={'workflow':'Render Other Versions Stock First Rebuild V3','run_id':run_id,'status':run.get('status'),'conclusion':run.get('conclusion')}
          if run.get('status')=='completed' and run.get('conclusion')=='success':
              req=urllib.request.Request(f'https://api.github.com/repos/jameswatson1077/tiktok-videos/actions/runs/{run_id}/artifacts',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: artifacts=json.load(r).get('artifacts') or []
              artifact=next((a for a in artifacts if a.get('name')=='other-versions-stock-first-rebuild-v3'),artifacts[0] if artifacts else None)
              if artifact:
                  aid=int(artifact['id'])
                  req=urllib.request.Request(f'https://api.github.com/repos/jameswatson1077/tiktok-videos/actions/artifacts/{aid}/zip',headers=headers)
                  with urllib.request.build_opener(urllib.request.HTTPRedirectHandler()).open(req,timeout=30) as r: signed=r.geturl()
                  payload.update({'artifact_id':aid,'artifact_name':artifact.get('name'),'artifact_size_bytes':artifact.get('size_in_bytes'),'signed_download_url':signed})
          elif run.get('status')=='completed':
              result=subprocess.run(['gh','run','view',str(run_id),'--repo','jameswatson1077/tiktok-videos','--log-failed'],capture_output=True,text=True)
              text=(result.stdout or '')+'\n'+(result.stderr or '')
              payload['failure_excerpt']=[line for line in text.splitlines() if 'ERROR' in line or 'FIX' in line or 'failed' in line.lower() or 'exact' in line.lower()][-50:]
              payload['failure_log_tail']=text[-16000:]
          pathlib.Path('/tmp/progress-b.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
          curl --fail --silent --show-error --retry 5 --retry-delay 2 -X POST --data-binary @/tmp/progress-b.json "$OUTPUT_URL"
