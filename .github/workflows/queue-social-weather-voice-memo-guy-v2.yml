name: Queue Social Weather Voice Memo Guy V2

on:
  push:
    branches:
      - video/social-weather-voice-memo-guy-v2
    paths:
      - build/social-weather-voice-memo-guy/READY

permissions:
  contents: write

jobs:
  validate_voiceover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install media probe
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Restore and validate supplied narration
        shell: bash
        run: |
          set -euo pipefail
          build="build/social-weather-voice-memo-guy"
          shopt -s nullglob
          parts=("$build"/vo.mp3.b64.part[0-9][0-9][0-9])
          test "${#parts[@]}" -eq 13
          cat "${parts[@]}" | base64 --decode > "$build/vo.mp3"

          expected="$(tr -d '[:space:]' < "$build/vo-clean.sha256")"
          actual="$(sha256sum "$build/vo.mp3" | awk '{print $1}')"
          test "$actual" = "$expected"

          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$build/vo.mp3")"
          python3 - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 175.0 <= duration <= 185.0:
              raise SystemExit(f"unexpected narration duration: {duration:.3f}s")
          print(f"validated supplied narration: {duration:.3f}s")
          PY

  render:
    needs: validate_voiceover
    uses: ./.github/workflows/render.yml
    with:
      slug: social-weather-voice-memo-guy
    secrets: inherit
